<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<div id="w-root">
    <style>
        /* CSS VARIABLES & RESET */
        #w-root {
            --w-sage: #717d6c;
            --w-dark: #3a4437;
            --w-gold: #c5a059;
            --w-cream: #fcfaf2;
            --w-glass: rgba(255, 255, 255, 0.85);
            font-family: 'Playfair Display', serif;
            background: var(--w-cream);
            color: var(--w-dark);
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. HERO VIDEO */
        #w-hero {
            height: 85vh; 
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #w-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 2. CONTENT SECTIONS */
        .w-section {
            padding: 50px 20px 0px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .w-reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            margin-bottom: 10px;
            width: 100%;
        }

        .w-reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        #w-root h2 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.8rem, 12vw, 3.5rem);
            color: var(--w-sage);
            margin: 0;
        }

        .w-sub {
            font-family: 'Cinzel', serif;
            font-size: .7rem;
            letter-spacing: 3px;
            color: var(--w-gold);
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* 3. CALENDAR CUBE */
        .w-card-box {
            background: var(--w-glass);
            padding: 25px 15px;
            border-radius: 80px 80px 20px 20px;
            width: 75%;
            max-width: 230px;
            border: 0.5px solid rgba(197, 160, 89, 0.3);
            box-shadow: 0 10px 20px rgba(113, 125, 108, 0.05);
            margin: 0 auto;
        }

        .w-cubes {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .w-wrap { width: 50px; height: 50px; perspective: 1000px; }
        .w-cube {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(.4, 0, 0.2, 1);
        }

        .w-face {
            position: absolute; width: 50px; height: 50px;
            background: #fff;
            border: 0.5px solid var(--w-gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; font-family: 'Cinzel', serif;
            color: var(--w-dark);
        }

        .w-front  { transform: rotateY(0deg) translateZ(25px); }
        .w-back   { transform: rotateY(180deg) translateZ(25px); }
        .w-top    { transform: rotateX(90deg) translateZ(25px); }
        .w-bottom { transform: rotateX(-90deg) translateZ(25px); }

        .w-month-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
        .w-month-text { font-family: 'Cinzel', serif; letter-spacing: 3px; font-size: 0.9rem; font-weight: 700; }
        .w-year-line { width: 20px; height: 1px; background: var(--w-gold); margin: 4px 0; }
        .w-year-text { font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--w-sage); }

        /* 4. TIMER */
        .w-timer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }
        .w-t-unit { display: flex; flex-direction: column; align-items: center; min-width: 40px; }
        .w-t-sep { font-size: 1rem; color: var(--w-gold); padding-bottom: 10px; }
        .w-val { font-size: 1.4rem; color: var(--w-dark); font-family: 'Playfair Display', serif; }
        .w-label { font-size: 0.5rem; text-transform: uppercase; color: var(--w-gold); letter-spacing: 1px; }
        .w-time-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.9rem; color: var(--w-sage); margin-top: 10px; }

        /* 5. VENUE TEXT */
    
        .w-venue-pre {
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--w-gold);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }
        .w-venue-name {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--w-dark);
            text-transform: uppercase;
        }

        /* 6. GALLERY SECTION */
        .w-gallery-section {
            padding: 10px 0 100px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            min-height: 220px;
            touch-action: pan-y;
            cursor: grab;
        }

        .w-gallery-section:active { cursor: grabbing; }

        .w-image-stack {
            position: relative;
            width: 280px; 
            height: 180px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .w-stack-img {
            position: absolute;
            width: 280px;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid #fff;
            opacity: 1; /* Keep visible so the fold/unfold is seen */
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            z-index: 1;
        }

        /* Initial Stacked Layout (The "Folded" State) */
        .img-1 { transform: translate(0, 0) rotate(0deg); z-index: 3; }
        .img-2 { transform: translate(8px, 8px) rotate(2deg); z-index: 2; }
        .img-3 { transform: translate(16px, 16px) rotate(4deg); z-index: 1; }

        /* Unstacked / Escape State */
        .scatter.img-1 { transform: translate(-100px, -15px) rotate(-6deg); }
        .scatter.img-2 { transform: translate(0, 10px) rotate(0deg); }
        .scatter.img-3 { transform: translate(100px, -15px) rotate(6deg); }

        /* Carousel Active State (after scatter) */
        .carousel-active .w-stack-img {
            opacity: 0;
            transform: scale(0.8) translate(0, 0) rotate(0deg);
            pointer-events: auto;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1), opacity 0.3s ease;
        }
        .carousel-active .w-stack-img.active {
            opacity: 1;
            transform: scale(1) translate(0, 0);
            z-index: 10;
        }
        .carousel-active .w-stack-img.next {
            opacity: 0.35;
            transform: scale(0.8) translate(280px, 0);
            z-index: 5;
        }
        .carousel-active .w-stack-img.prev {
            opacity: 0.35;
            transform: scale(0.8) translate(-280px, 0);
            z-index: 5;
        }
        .is-dragging .w-stack-img { transition: none !important; }
    </style>

    <section id="w-hero">
        <video id="w-video" autoplay muted playsinline>
            <source src="./details.mp4" type="video/mp4">
        </video>
    </section>

    <section class="w-section">
        <div class="w-reveal">
            <h2>Save the Date</h2>
            <div class="w-sub">Chino & Diane</div>
        </div>

        <div class="w-reveal">
            <div class="w-card-box">
                <div class="w-cubes">
                    <div class="w-wrap"><div class="w-cube" id="wC1"><div class="w-face w-front" id="wN1">1</div><div class="w-face w-back">0</div><div class="w-face w-top">4</div><div class="w-face w-bottom">7</div></div></div>
                    <div class="w-wrap"><div class="w-cube" id="wC2"><div class="w-face w-front" id="wN2">9</div><div class="w-face w-back">2</div><div class="w-face w-top">5</div><div class="w-face w-bottom">8</div></div></div>
                </div>
                <div class="w-month-wrap">
                    <span class="w-month-text">APRIL</span>
                    <div class="w-year-line"></div>
                    <span class="w-year-text">2026</span>
                </div>
            </div>
        </div>

        <div class="w-reveal">
            <div class="w-timer-container">
                <div class="w-t-unit"><span class="w-val" id="wD">00</span><span class="w-label">Days</span></div>
                <div class="w-t-sep">:</div>
                <div class="w-t-unit"><span class="w-val" id="wH">00</span><span class="w-label">Hrs</span></div>
                <div class="w-t-sep">:</div>
                <div class="w-t-unit"><span class="w-val" id="wM">00</span><span class="w-label">Min</span></div>
                <div class="w-t-sep">:</div>
                <div class="w-t-unit"><span class="w-val" id="wS">00</span><span class="w-label">Sec</span></div>
            </div>
            <p class="w-time-text">Ten o'clock in the morning</p>
        </div>

        <div class="w-reveal ">
            <span class="w-venue-pre">The place to be for our wedding:</span>
            <div class="w-venue-name">BISTRO ALEJANDRO</div>
        </div>
    </section>

    <section class="w-gallery-section" id="wGalleryTrigger">
        <div class="w-image-stack" id="wSlider">
            <img src="./place.jpeg" class="w-stack-img img-1" id="gImg1">
            <img src="./place2.png" class="w-stack-img img-2" id="gImg2">
            <img src="./place3.png" class="w-stack-img img-3" id="gImg3">
        </div>
    </section>

    <script>
        (function() {
            const g1 = document.getElementById('gImg1'), g2 = document.getElementById('gImg2'), g3 = document.getElementById('gImg3');
            const gallerySection = document.getElementById('wGalleryTrigger');
            const images = [g1, g2, g3];
            let carouselActive = false, currentIndex = 0;

            // 1. CONTENT REVEAL OBSERVER
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("active"); });
            }, { threshold: 0.1 });
            document.querySelectorAll(".w-reveal").forEach(r => observer.observe(r));

            // 2. BIDIRECTIONAL GALLERY OBSERVER (Centered Trigger)
            const galleryObserver = new IntersectionObserver(entries => {
                const entry = entries[0];
                if (entry.isIntersecting) {
                    // PLAY ANIMATION (Unstack)
                    images.forEach((img, i) => {
                        setTimeout(() => img.classList.add('scatter'), i * 150);
                    });
                    
                    // Delay activation of interactive carousel until scatter is done
                    setTimeout(() => {
                        if (entry.isIntersecting) {
                            carouselActive = true;
                            gallerySection.classList.add('carousel-active');
                            updateCarousel();
                        }
                    }, 800);
                } else {
                    // REVERSE ANIMATION (Fold back)
                    carouselActive = false;
                    gallerySection.classList.remove('carousel-active');
                    images.forEach(img => {
                        img.classList.remove('scatter');
                        img.style.transform = ''; // Clear carousel overrides
                        img.style.opacity = '';
                    });
                }
            }, { 
                threshold: 0.7, // Trigger when 70% of section is in view (centered)
                rootMargin: "0px" 
            });
            galleryObserver.observe(gallerySection);

            // 3. TOUCH/SWIPE ENGINE
            let startX = 0, currentX = 0, isDragging = false;
            function updateCarousel(offset = 0) {
                if (!carouselActive) return;
                images.forEach((img, i) => {
                    img.classList.remove('active', 'next', 'prev');
                    let pos = (i - currentIndex + images.length) % images.length;
                    img.style.transform = '';
                    img.style.opacity = '';
                    if (pos === 0) { 
                        img.classList.add('active');
                        img.style.transform = `translateX(${offset}px) scale(${1 - Math.abs(offset/1200)})`;
                    } else if (pos === 1) { 
                        img.classList.add('next');
                        img.style.transform = `translateX(${280 + offset}px) scale(0.8)`;
                        img.style.opacity = 0.35 + (offset < 0 ? Math.abs(offset/400) : 0);
                    } else { 
                        img.classList.add('prev');
                        img.style.transform = `translateX(${-280 + offset}px) scale(0.8)`;
                        img.style.opacity = 0.35 + (offset > 0 ? offset/400 : 0);
                    }
                });
            }
            const start = (e) => {
                if (!carouselActive) return;
                isDragging = true;
                startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                gallerySection.classList.add('is-dragging');
            };
            const move = (e) => {
                if (!isDragging) return;
                currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                let walk = currentX - startX;
                updateCarousel(walk);
            };
            const end = (e) => {
                if (!isDragging) return;
                isDragging = false;
                gallerySection.classList.remove('is-dragging');
                let endX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX;
                let diff = startX - endX;
                if (Math.abs(diff) > 50) {
                    currentIndex = (currentIndex + (diff > 0 ? 1 : -1) + images.length) % images.length;
                }
                updateCarousel(0);
            };

            gallerySection.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);
            gallerySection.addEventListener('touchstart', start, {passive: true});
            gallerySection.addEventListener('touchmove', move, {passive: true});
            gallerySection.addEventListener('touchend', end, {passive: true});

            // 4. CUBE & TIMER
            let rot = 0;
            function spinCubes() {
                const c1 = document.getElementById("wC1"), c2 = document.getElementById("wC2");
                const n1 = document.getElementById("wN1"), n2 = document.getElementById("wN2");
                if(!c1) return;
                rot += 360;
                c1.style.transform = `rotateX(${rot}deg) rotateY(${rot}deg)`;
                c2.style.transform = `rotateX(${rot}deg) rotateY(${rot}deg)`;
                const mix = setInterval(() => {
                    n1.textContent = Math.floor(Math.random() * 10);
                    n2.textContent = Math.floor(Math.random() * 10);
                }, 100);
                setTimeout(() => { clearInterval(mix); n1.textContent = "1"; n2.textContent = "9"; }, 1500);
            }
            setInterval(spinCubes, 6000); spinCubes();

            const target = new Date("April 19, 2026 10:00:00").getTime();
            function updateTimer() {
                const now = new Date().getTime(), diff = target - now;
                if (diff < 0) return;
                document.getElementById("wD").innerText = String(Math.floor(diff / 864e5)).padStart(2, '0');
                document.getElementById("wH").innerText = String(Math.floor((diff % 864e5) / 36e5)).padStart(2, '0');
                document.getElementById("wM").innerText = String(Math.floor((diff % 36e5) / 6e4)).padStart(2, '0');
                document.getElementById("wS").innerText = String(Math.floor((diff % 6e4) / 1e3)).padStart(2, '0');
            }
            setInterval(updateTimer, 1000); updateTimer();
        })();
    </script>
</div>
