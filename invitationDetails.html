<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation - Chino & Diane</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cinzel:wght@400;700&family=Great+Vibes&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* ===== GLOBAL STYLES ===== */
body, html { 
    margin:0; padding:0; background: #fcfaf2; scroll-behavior: smooth; overflow-x: hidden; 
    -webkit-tap-highlight-color: transparent;
}

#w-root {
    --w-sage: #717d6c; --w-gold: #c5a059; --w-dark: #3a4437; --w-cream: #fcfaf2; --w-glass: rgba(255,255,255,0.95);
    font-family: 'Playfair Display', serif; display: flex; flex-direction: column; align-items: center;
}

.w-reveal { opacity: 0; transform: translateY(30px); transition: all 1s ease-out; width: 100%; }
.w-reveal.active { opacity: 1; transform: translateY(0); }

/* ===== 1. HERO ===== */
#w-hero { 
    height: 70vh; width: 100%; background: #000; position: relative; overflow: hidden; margin-bottom: -20px; 
}
#w-hero img { width: 100%; height: 100%; object-fit: cover; }
#w-hero::after {
    content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 250px; 
    background: linear-gradient(to bottom, rgba(252, 250, 242, 0) 0%, rgba(252, 250, 242, 0.4) 30%, rgba(252, 250, 242, 0.8) 70%, #fcfaf2 100%);
    z-index: 2;
}

/* ===== 2. CALENDAR & TIMER ===== */
.w-section { 
    width: 100%; max-width: 500px; padding: 20px 25px 40px; text-align: center; box-sizing: border-box; 
    display: flex; flex-direction: column; align-items: center; gap: 25px; position: relative; z-index: 3;
}
h2 { font-family: 'Great Vibes', cursive; font-size: clamp(3rem, 12vw, 4rem); color: var(--w-sage); margin: 0; }
.w-names { font-family:'Cinzel'; letter-spacing:4px; color:var(--w-gold); font-size: 0.7rem; margin-top: 8px; }

.w-card-box {
    background: var(--w-glass); padding: 30px 20px; border-radius: 120px 120px 40px 40px; 
    width: 200px; border: 1px solid rgba(197,160,89,0.2); box-shadow: 0 15px 35px rgba(0,0,0,0.05);
}
.w-cubes { display: flex; gap: 12px; justify-content: center; margin-bottom: 15px; }
.w-wrap { width: 45px; height: 45px; perspective: 1000px; }
.w-cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1.8s cubic-bezier(0.4,0,0.2,1); }
.w-face { position: absolute; width: 45px; height: 45px; background: #fff; border: 0.5px solid var(--w-gold); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-family: 'Cinzel', serif; color: var(--w-dark); }
.w-front { transform: rotateY(0deg) translateZ(22.5px); }
.w-back { transform: rotateY(180deg) translateZ(22.5px); }
.w-top { transform: rotateX(90deg) translateZ(22.5px); }
.w-bottom { transform: rotateX(-90deg) translateZ(22.5px); }

.w-timer-container { display: flex; justify-content: center; gap: 15px; }
.w-t-unit { display: flex; flex-direction: column; align-items: center; min-width: 50px; }
.w-val { font-size: 1.2rem; color: var(--w-dark); font-family: 'Cinzel', serif; font-weight: 700; }
.w-label { font-size: 0.55rem; text-transform: uppercase; color: var(--w-gold); letter-spacing: 1px; }

/* ===== 3. 3D CAROUSEL ===== */
.icon-cards { position: relative; width: 60vw; height: 75vw; max-width: 280px; max-height: 350px; margin: 40px 0; perspective: 1000px; }
.icon-cards__content { position: absolute; width: 100%; height: 100%; transform-origin: center; transform-style: preserve-3d; transform: translateZ(-30vw) rotateY(0); animation: carousel 12s infinite cubic-bezier(0.77, 0, 0.175, 1) forwards; }
.icon-cards__item { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 4px solid #fff; }
.icon-cards__item img { width: 100%; height: 100%; object-fit: cover; }
.icon-cards__item:nth-child(1) { transform: rotateY(0deg) translateZ(35vw); }
.icon-cards__item:nth-child(2) { transform: rotateY(120deg) translateZ(35vw); }
.icon-cards__item:nth-child(3) { transform: rotateY(240deg) translateZ(35vw); }

@keyframes carousel {
    0%, 15% { transform: translateZ(-35vw) rotateY(0); }
    30%, 45% { transform: translateZ(-35vw) rotateY(-120deg); }
    60%, 75% { transform: translateZ(-35vw) rotateY(-240deg); }
    90%, 100% { transform: translateZ(-35vw) rotateY(-360deg); }
}

/* ===== 4. MAP ===== */
.map-card { border: 1px solid var(--w-gold); padding: 25px 15px; background: #fff; width: 100%; box-sizing: border-box; }
.map-title { font-family:'Cinzel'; font-size: 0.75rem; font-weight:700; letter-spacing:2px; margin-bottom: 15px; color: var(--w-dark); }

/* ===== 5. ATTIRE SECTION ===== */
.w-attire-section { width: 100%; max-width: 500px; padding: 40px 24px; text-align: center; box-sizing: border-box; overflow: hidden; }
.dear-reader { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: var(--w-gold); margin-bottom: 10px; }

.scroll-track-container { display: flex; justify-content: center; gap: 10px; margin: 30px 0; height: 300px; }
.slide-actor { position: relative; width: 45%; height: 100%; will-change: transform, opacity; }
.slide-actor img { width: 100%; height: 100%; object-fit: contain; }

#actor-left { transform: translateX(-150%); opacity: 0; }
#actor-right { transform: translateX(150%); opacity: 0; }

.color-overlay { 
    position: absolute; top:0; left:0; width:100%; height:100%; 
    mix-blend-mode: multiply; transition: background-color 0.5s; 
    -webkit-mask-size:contain; mask-size:contain; -webkit-mask-repeat:no-repeat; mask-position:center; 
    pointer-events: none; 
}
#overlayBride { -webkit-mask-image: url('./maidss.png.png'); mask-image: url('./maidss.png.png'); }
#overlayGroom { -webkit-mask-image: url('./groom.png(1)(1).png'); mask-image: url('./groom.png(1)(1).png'); }

/* Palette Fixed */
.palette { display: flex; justify-content: center; gap: 5px; flex-wrap: nowrap; margin: 15px auto; width: 100%; }
@keyframes pulse-hint {
    0% { transform: scale(1); filter: drop-shadow(0 0 0px var(--w-gold)); }
    50% { transform: scale(1.1); filter: drop-shadow(0 0 8px var(--w-gold)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 0px var(--w-gold)); }
}
.pulse { animation: pulse-hint 2s infinite ease-in-out; }
.color-frame { position: relative; width: 52px; height: 52px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; flex-shrink: 0; }
.color-frame::after { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: url('./palette-bg.png'); background-size: contain; background-repeat: no-repeat; background-position: center; z-index: 2; pointer-events: none; opacity: 0.7; }
.color-frame.active-color::after { opacity: 1; filter: sepia(1) saturate(5) hue-rotate(10deg); transform: scale(1.15); }
.color-btn { position: relative; width: 28px; height: 28px; border-radius: 50%; z-index: 1; }
</style>
</head>

<body>

<div id="w-root">
    <section id="w-hero"><img src="./sample1.jpg"></section>
    
    <section class="w-section w-reveal">
        <div>
            <h2>Save the Date</h2>
            <div class="w-names">CHINO & DIANE</div>
        </div>
        
        <div class="w-card-box">
            <div class="w-cubes">
                <div class="w-wrap"><div class="w-cube" id="wC1"><div class="w-face w-front">1</div><div class="w-face w-back">0</div><div class="w-face w-top">4</div><div class="w-face w-bottom">7</div></div></div>
                <div class="w-wrap"><div class="w-cube" id="wC2"><div class="w-face w-front">9</div><div class="w-face w-back">2</div><div class="w-face w-top">5</div><div class="w-face w-bottom">8</div></div></div>
            </div>
            <div style="text-align:center; font-family: 'Cinzel', serif;">
                <span style="font-size:0.9rem; letter-spacing:3px; font-weight:700;">APRIL</span>
                <div style="height:1px; background:var(--w-gold); width:25px; margin:8px auto; opacity:0.4;"></div>
                <span style="font-size:0.7rem; color:var(--w-gold);">2026</span>
            </div>
        </div>

        <div class="w-timer-container">
            <div class="w-t-unit"><span class="w-val" id="wD">00</span><span class="w-label">Days</span></div>
            <div class="w-t-unit"><span class="w-val" id="wH">00</span><span class="w-label">Hrs</span></div>
            <div class="w-t-unit"><span class="w-val" id="wM">00</span><span class="w-label">Min</span></div>
            <div class="w-t-unit"><span class="w-val" id="wS">00</span><span class="w-label">Sec</span></div>
        </div>

        <figure class="icon-cards w-reveal">
          <div class="icon-cards__content">
            <div class="icon-cards__item"><img src="./place.jpeg"></div>
            <div class="icon-cards__item"><img src="./place2.png"></div>
            <div class="icon-cards__item"><img src="./place3.png"></div>
          </div>
        </figure>
    </section>

    <section class="w-attire-section">
        <div class="w-reveal">
            <div class="dear-reader">Dear Readers,</div>
            <p style="font-family:'Libre Baskerville'; font-style:italic; font-size:1rem; color:var(--w-dark);">
                “In the spirit of Bridgerton, please arrive in your finest Regency-inspired attire.”
            </p>
        </div>

        <div class="scroll-track-container" id="attireTrigger">
            <div id="actor-left" class="slide-actor">
                <img src="./maidss.png.png">
                <div class="color-overlay" id="overlayBride"></div>
            </div>
            <div id="actor-right" class="slide-actor">
                <img src="./groom.png(1)(1).png">
                <div class="color-overlay" id="overlayGroom"></div>
            </div>
        </div>

        <div class="w-reveal">
            <p style="font-family: 'Cinzel'; font-size: 0.65rem; color: var(--w-gold); letter-spacing: 2px;">Tap a jewel to preview the palette</p>
            <div class="palette">
                <div class="color-frame pulse" onclick="changeColor('#FFFFE0', this)"><div class="color-btn" style="background-color: #FFFFE0;"></div></div>
                <div class="color-frame" onclick="changeColor('#FFFACD', this)"><div class="color-btn" style="background-color: #FFFACD;"></div></div>
                <div class="color-frame" onclick="changeColor('#FFFF66', this)"><div class="color-btn" style="background-color: #FFFF66;"></div></div>
                <div class="color-frame" onclick="changeColor('#556B2F', this)"><div class="color-btn" style="background-color: #556B2F;"></div></div>
                <div class="color-frame" onclick="changeColor('#8FBC8F', this)"><div class="color-btn" style="background-color: #8FBC8F;"></div></div>
                <div class="color-frame" onclick="changeColor('#BCE3BC', this)"><div class="color-btn" style="background-color: #BCE3BC;"></div></div>
            </div>
        </div>
    </section>
</div>

<script>
// Palette Logic (Global)
window.changeColor = function(color, element) {
    const bride = document.getElementById('overlayBride');
    const groom = document.getElementById('overlayGroom');
    if(bride) bride.style.backgroundColor = color;
    if(groom) groom.style.backgroundColor = color;
    document.querySelectorAll('.color-frame').forEach(f => f.classList.remove('active-color', 'pulse'));
    if(element) element.classList.add('active-color');
};

(function(){
    // 1. Cube Rotation Fix
    let rot = 0;
    setInterval(() => {
        rot += 360;
        const c1 = document.getElementById("wC1"), c2 = document.getElementById("wC2");
        if(c1) c1.style.transform = `rotateX(${rot}deg) rotateY(${rot}deg)`;
        if(c2) c2.style.transform = `rotateX(${rot}deg) rotateY(${rot}deg)`;
    }, 8000);

    // 2. Timer
    const target = new Date("April 19, 2026 10:00:00").getTime();
    function updateTimer(){
        const now = new Date().getTime(), diff = target - now;
        if(diff < 0) return;
        document.getElementById("wD").innerText = String(Math.floor(diff/864e5)).padStart(2,'0');
        document.getElementById("wH").innerText = String(Math.floor((diff%864e5)/36e5)).padStart(2,'0');
        document.getElementById("wM").innerText = String(Math.floor((diff%36e5)/6e4)).padStart(2,'0');
        document.getElementById("wS").innerText = String(Math.floor((diff%6e4)/1e3)).padStart(2,'0');
    }
    setInterval(updateTimer,1000); updateTimer();

    // 3. Reveal Observer
    const observer = new IntersectionObserver(entries => {
        entries.forEach(e => { if(e.isIntersecting) e.target.classList.add("active"); });
    }, { threshold: 0.1 });
    document.querySelectorAll(".w-reveal").forEach(r => observer.observe(r));

    // 4. Scroll-Dependent Actor Logic
    const trigger = document.getElementById('attireTrigger');
    const left = document.getElementById('actor-left');
    const right = document.getElementById('actor-right');

    function handleScroll() {
        if(!trigger || !left || !right) return;
        const rect = trigger.getBoundingClientRect();
        const winH = window.innerHeight;

        // Progress 0 to 1 based on trigger position
        let progress = (winH - rect.top) / (winH * 0.8);
        progress = Math.max(0, Math.min(1, progress));

        const moveX = (1 - progress) * 150; 
        left.style.transform = `translateX(-${moveX}%)`;
        left.style.opacity = progress;
        right.style.transform = `translateX(${moveX}%)`;
        right.style.opacity = progress;
    }

    // Capture true is vital for index.html modal scrolling
    window.addEventListener('scroll', handleScroll, true);
    handleScroll();
})();
</script>
</body>
</html>
