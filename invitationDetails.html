<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<div id="w-root">
<style>
    /* CSS VARIABLES & RESET */
    #w-root {
        --w-sage: #717d6c;
        --w-dark: #3a4437;
        --w-gold: #c5a059;
        --w-cream: #fcfaf2;
        --w-glass: rgba(255, 255, 255, 0.92);
        font-family: 'Playfair Display', serif;
        background: var(--w-cream);
        color: var(--w-dark);
        width: 100%;
        max-width: 100vw; /* Strict width */
        margin: 0;
        padding: 0;
        overflow-x: hidden; /* Pinaka-importante para mawala yung space sa kanan */
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* HERO VIDEO */
    #w-hero { height: 80vh; width: 100%; background: #000; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
    #w-video { width: 100%; height: 100%; object-fit: cover; }

    /* CONTENT SECTIONS */
    .w-section { 
        width: 100%;
        box-sizing: border-box; /* Kasama ang padding sa width calculation */
        padding: 50px 20px 20px 20px;
        text-align: center; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        gap: 25px;
    }
    
    .w-reveal { opacity: 0; transform: translateY(25px); transition: all 1s cubic-bezier(0.22, 1, 0.36, 1); width: 100%; display: flex; flex-direction: column; align-items: center; }
    .w-reveal.active { opacity: 1; transform: translateY(0); }

    #w-root h2 { font-family: 'Great Vibes', cursive; font-size: clamp(2.8rem, 12vw, 4rem); color: var(--w-sage); margin: 0; width: 100%; }
    .w-sub { font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 4px; color: var(--w-gold); margin-top: 5px; text-transform: uppercase; }

    /* CALENDAR */
    .w-card-box { 
        background: var(--w-glass); 
        padding: 30px 15px; 
        border-radius: 90px 90px 30px 30px; 
        width: 230px; 
        border: 1px solid rgba(197, 160, 89, 0.25); 
        box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .w-cubes { display: flex; gap: 12px; justify-content: center; align-items: center; margin-bottom: 15px; width: 100%; }
    .w-wrap { width: 50px; height: 50px; perspective: 1000px; }
    .w-cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1.5s cubic-bezier(.4, 0, 0.2, 1); }
    .w-face { position: absolute; width: 50px; height: 50px; background: #fff; border: 0.5px solid var(--w-gold); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-family: 'Cinzel', serif; color: var(--w-dark); backface-visibility: hidden; }
    .w-front { transform: rotateY(0deg) translateZ(25px); }
    .w-back { transform: rotateY(180deg) translateZ(25px); }
    .w-top { transform: rotateX(90deg) translateZ(25px); }
    .w-bottom { transform: rotateX(-90deg) translateZ(25px); }

    /* TIMER */
    .w-timer-container { display: flex; justify-content: center; gap: 12px; width: 100%; }
    .w-val { font-size: 1.4rem; color: var(--w-dark); font-family: 'Cinzel', serif; }
    .w-label { font-size: 0.5rem; text-transform: uppercase; color: var(--w-gold); letter-spacing: 1px; }

    /* VENUE */
    .w-venue-name { font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 700; letter-spacing: 3px; color: var(--w-dark); width: 100%; }

    /* GALLERY - FIXED WIDTH ISSUES */
    .w-gallery-section {
        width: 100%;
        max-width: 100vw;
        padding: 10px 0 100px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        min-height: 350px;
        touch-action: pan-y;
        overflow: hidden; /* Pinipigilan nito ang pag-expand sa kanan */
    }

    .w-image-stack { position: relative; width: 260px; height: 300px; display: flex; justify-content: center; align-items: center; }

    .w-stack-img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        border: 5px solid #fff;
        transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        pointer-events: none;
    }

    /* Stack to Scatter Logic */
    .img-1 { transform: translate(0, 0) rotate(-2deg); z-index: 3; }
    .img-2 { transform: translate(5px, 5px) rotate(1deg); z-index: 2; }
    .img-3 { transform: translate(10px, 10px) rotate(4deg); z-index: 1; }

    .scatter.img-1 { transform: translate(-80px, -10px) rotate(-6deg); }
    .scatter.img-2 { transform: translate(0, 10px) rotate(0deg); }
    .scatter.img-3 { transform: translate(80px, -10px) rotate(6deg); }

    /* Carousel Mode */
    .carousel-active .w-stack-img { opacity: 0; transform: scale(0.5) translateX(0); }
    .carousel-active .w-stack-img.active { opacity: 1; transform: scale(1) translateX(0); z-index: 30; }
    .carousel-active .w-stack-img.next { opacity: 0.4; transform: scale(0.8) translateX(220px); z-index: 20; }
    .carousel-active .w-stack-img.prev { opacity: 0.4; transform: scale(0.8) translateX(-220px); z-index: 20; }
</style>

<section id="w-hero">
    <video id="w-video" autoplay muted playsinline loop>
        <source src="./details.mp4" type="video/mp4">
    </video>
</section>

<section class="w-section">
    <div class="w-reveal">
        <h2>Save the Date</h2>
        <div class="w-sub">Chino & Diane</div>
    </div>
    
    <div class="w-reveal">
        <div class="w-card-box">
            <div class="w-cubes">
                <div class="w-wrap"><div class="w-cube" id="wC1"><div class="w-face w-front" id="wN1">1</div><div class="w-face w-back">0</div><div class="w-face w-top">4</div><div class="w-face w-bottom">7</div></div></div>
                <div class="w-wrap"><div class="w-cube" id="wC2"><div class="w-face w-front" id="wN2">9</div><div class="w-face w-back">2</div><div class="w-face w-top">5</div><div class="w-face w-bottom">8</div></div></div>
            </div>
            <div style="text-align: center; font-family: 'Cinzel', serif;">
                <span style="font-size: 1rem; letter-spacing: 4px; font-weight: 700;">APRIL</span>
                <div style="height: 1px; background: var(--w-gold); width: 30px; margin: 6px auto; opacity: 0.4;"></div>
                <span style="font-size: 0.8rem; letter-spacing: 3px; color: var(--w-gold);">2026</span>
            </div>
        </div>
    </div>

    <div class="w-reveal">
        <div class="w-timer-container">
            <div class="w-t-unit"><span class="w-val" id="wD">00</span><span class="w-label">Days</span></div>
            <div class="w-t-unit"><span class="w-val" id="wH">00</span><span class="w-label">Hrs</span></div>
            <div class="w-t-unit"><span class="w-val" id="wM">00</span><span class="w-label">Min</span></div>
            <div class="w-t-unit"><span class="w-val" id="wS">00</span><span class="w-label">Sec</span></div>
        </div>
    </div>

    <div class="w-reveal">
        <span class="w-venue-pre">The place to be for our wedding:</span>
        <div class="w-venue-name">BISTRO ALEJANDRO</div>
    </div>
</section>

<section class="w-gallery-section" id="wGalleryTrigger">
    <div class="w-image-stack" id="wSlider">
        <img src="./place.jpeg" class="w-stack-img img-1" id="gImg1">
        <img src="./place2.png" class="w-stack-img img-2" id="gImg2">
        <img src="./place3.png" class="w-stack-img img-3" id="gImg3">
    </div>
</section>

<script>
(function() {
    const gallerySection = document.getElementById('wGalleryTrigger');
    const images = [document.getElementById('gImg1'), document.getElementById('gImg2'), document.getElementById('gImg3')];
    let carouselActive = false;
    let currentIndex = 0;

    const revealObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("active"); });
    }, { threshold: 0.1 });
    document.querySelectorAll(".w-reveal").forEach(r => revealObserver.observe(r));

    const galleryObserver = new IntersectionObserver(entries => {
        const entry = entries[0];
        if (entry.isIntersecting) {
            images.forEach((img, i) => setTimeout(() => img.classList.add('scatter'), i * 120));
            setTimeout(() => {
                if(entry.isIntersecting) {
                    carouselActive = true;
                    gallerySection.classList.add('carousel-active');
                    updateCarousel();
                }
            }, 1000);
        } else {
            carouselActive = false;
            gallerySection.classList.remove('carousel-active');
            images.forEach(img => {
                img.classList.remove('scatter', 'active', 'next', 'prev');
                img.style.transform = ''; img.style.opacity = '';
            });
        }
    }, { threshold: 0.4 });
    galleryObserver.observe(gallerySection);

    function updateCarousel(offset = 0) {
        if (!carouselActive) return;
        images.forEach((img, i) => {
            img.classList.remove('active', 'next', 'prev');
            let pos = (i - currentIndex + images.length) % images.length;
            if (pos === 0) {
                img.classList.add('active');
                img.style.transform = `translateX(${offset}px) scale(${1 - Math.abs(offset/1000)})`;
                img.style.opacity = 1;
            } else if (pos === 1) {
                img.classList.add('next');
                img.style.transform = `translateX(${220 + offset}px) scale(0.8)`;
                img.style.opacity = 0.4;
            } else {
                img.classList.add('prev');
                img.style.transform = `translateX(${-220 + offset}px) scale(0.8)`;
                img.style.opacity = 0.4;
            }
        });
    }

    let startX = 0, isDragging = false, currentOffset = 0;
    const handleStart = (e) => {
        if (!carouselActive) return;
        isDragging = true;
        startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    };
    const handleMove = (e) => {
        if (!isDragging) return;
        const x = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        currentOffset = x - startX;
        updateCarousel(currentOffset);
    };
    const handleEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        if (Math.abs(currentOffset) > 70) currentIndex = (currentIndex + (currentOffset < 0 ? 1 : -1) + images.length) % images.length;
        currentOffset = 0;
        updateCarousel(0);
    };

    gallerySection.addEventListener('touchstart', handleStart, {passive: true});
    gallerySection.addEventListener('mousedown', handleStart);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchend', handleEnd);
    window.addEventListener('mouseup', handleEnd);

    let rot = 0;
    function spinCubes() {
        const c1 = document.getElementById("wC1"), c2 = document.getElementById("wC2");
        const n1 = document.getElementById("wN1"), n2 = document.getElementById("wN2");
        if (!c1) return;
        rot += 360;
        c1.style.transform = `rotateX(${rot}deg) rotateY(${rot}deg)`;
        c2.style.transform = `rotateX(${rot}deg) rotateY(${rot}deg)`;
        const mix = setInterval(() => { n1.textContent = Math.floor(Math.random() * 10); n2.textContent = Math.floor(Math.random() * 10); }, 100);
        setTimeout(() => { clearInterval(mix); n1.textContent = "1"; n2.textContent = "9"; }, 1500);
    }
    setInterval(spinCubes, 7000); spinCubes();

    const target = new Date("April 19, 2026 10:00:00").getTime();
    function updateTimer() {
        const now = new Date().getTime(), diff = target - now;
        if (diff < 0) return;
        document.getElementById("wD").innerText = String(Math.floor(diff / 864e5)).padStart(2, '0');
        document.getElementById("wH").innerText = String(Math.floor((diff % 864e5) / 36e5)).padStart(2, '0');
        document.getElementById("wM").innerText = String(Math.floor((diff % 36e5) / 6e4)).padStart(2, '0');
        document.getElementById("wS").innerText = String(Math.floor((diff % 6e4) / 1e3)).padStart(2, '0');
    }
    setInterval(updateTimer, 1000); updateTimer();
})();
</script>
</div>
