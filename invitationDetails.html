<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<div id="w-root">
    <style>
        /* CSS VARIABLES & RESET */
        #w-root {
            --w-sage: #717d6c;
            --w-dark: #3a4437;
            --w-gold: #c5a059;
            --w-cream: #fcfaf2;
            --w-glass: rgba(255, 255, 255, 0.85);
            
            font-family: 'Playfair Display', serif;
            background: var(--w-cream);
            color: var(--w-dark);
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. HERO VIDEO (85vh para may silip na susunod na section) */
        #w-hero {
            height: 85vh; 
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #w-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 2. CONTENT SECTIONS (Compact & Elegant Spacing) */
        .w-section {
            padding: 50px 20px 100px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .w-reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
            margin-bottom: 30px;
            width: 100%;
        }

        .w-reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        #w-root h2 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.8rem, 12vw, 3.5rem);
            color: var(--w-sage);
            margin: 0;
        }

        .w-sub {
            font-family: 'Cinzel', serif;
            font-size: .7rem;
            letter-spacing: 3px;
            color: var(--w-gold);
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* 3. CALENDAR CUBE (Compact Arched Look) */
        .w-card-box {
            background: var(--w-glass);
            padding: 25px 15px;
            border-radius: 80px 80px 20px 20px;
            width: 75%;
            max-width: 250px;
            border: 0.5px solid rgba(197, 160, 89, 0.3);
            box-shadow: 0 10px 20px rgba(113, 125, 108, 0.05);
            margin: 0 auto;
        }

        .w-cubes {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .w-wrap { width: 50px; height: 50px; perspective: 1000px; }
        .w-cube {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 2s cubic-bezier(.4, 0, 0.2, 1);
        }

        .w-face {
            position: absolute; width: 50px; height: 50px;
            background: #fff;
            border: 0.5px solid var(--w-gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; font-family: 'Cinzel', serif;
            color: var(--w-dark);
        }

        .w-front  { transform: rotateY(0deg) translateZ(25px); }
        .w-back   { transform: rotateY(180deg) translateZ(25px); }
        .w-top    { transform: rotateX(90deg) translateZ(25px); }
        .w-bottom { transform: rotateX(-90deg) translateZ(25px); }

        .w-month-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
        .w-month-text { font-family: 'Cinzel', serif; letter-spacing: 3px; font-size: 0.9rem; font-weight: 700; }
        .w-year-line { width: 20px; height: 1px; background: var(--w-gold); margin: 4px 0; }
        .w-year-text { font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--w-sage); }

        /* 4. TIMER (Minimalist) */
        .w-timer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
        }
        .w-t-unit { display: flex; flex-direction: column; align-items: center; min-width: 40px; }
        .w-t-sep { font-size: 1rem; color: var(--w-gold); padding-bottom: 10px; }
        .w-val { font-size: 1.4rem; color: var(--w-dark); font-family: 'Playfair Display', serif; }
        .w-label { font-size: 0.5rem; text-transform: uppercase; color: var(--w-gold); letter-spacing: 1px; }

        .w-time-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1rem; color: var(--w-sage); margin-top: 20px; }
    </style>

    <section id="w-hero">
        <video id="w-video" autoplay muted playsinline>
            <source src="./details.mp4" type="video/mp4">
        </video>
    </section>

    <section class="w-section" id="w-main-content">
        
        <div class="w-reveal">
            <h2>Save the Date</h2>
            <div class="w-sub">Chino & Diane</div>
        </div>

        <div class="w-reveal">
            <div class="w-card-box">
                <div class="w-cubes">
                    <div class="w-wrap">
                        <div class="w-cube" id="wC1">
                            <div class="w-face w-front" id="wN1">1</div>
                            <div class="w-face w-back">0</div>
                            <div class="w-face w-top">4</div>
                            <div class="w-face w-bottom">7</div>
                        </div>
                    </div>
                    <div class="w-wrap">
                        <div class="w-cube" id="wC2">
                            <div class="w-face w-front" id="wN2">9</div>
                            <div class="w-face w-back">2</div>
                            <div class="w-face w-top">5</div>
                            <div class="w-face w-bottom">8</div>
                        </div>
                    </div>
                </div>
                <div class="w-month-wrap">
                    <span class="w-month-text">APRIL</span>
                    <div class="w-year-line"></div>
                    <span class="w-year-text">2026</span>
                </div>
            </div>
        </div>

        <div class="w-reveal">
            <div class="w-timer-container">
                <div class="w-t-unit"><span class="w-val" id="wD">00</span><span class="w-label">Days</span></div>
                <div class="w-t-sep">:</div>
                <div class="w-t-unit"><span class="w-val" id="wH">00</span><span class="w-label">Hrs</span></div>
                <div class="w-t-sep">:</div>
                <div class="w-t-unit"><span class="w-val" id="wM">00</span><span class="w-label">Min</span></div>
                <div class="w-t-sep">:</div>
                <div class="w-t-unit"><span class="w-val" id="wS">00</span><span class="w-label">Sec</span></div>
            </div>
            <p class="w-time-text">Ten o'clock in the morning</p>
        </div>

    </section>

    <script>
        (function() {
            const video = document.getElementById('w-video');
            const scrollTarget = document.getElementById('w-main-content');
            
            // Hanapin ang scrollable container (yung .card.full-screen mo sa main style.css)
            const cardContainer = document.querySelector('.card.full-screen');

            // --- AUTO SCROLL FUNCTION ---
            video.onended = function() {
                if (cardContainer) {
                    // Mas accurate na scroll sa loob ng modal container
                    cardContainer.scrollTo({
                        top: scrollTarget.offsetTop,
                        behavior: 'smooth'
                    });
                } else {
                    // Fallback kung wala sa modal
                    scrollTarget.scrollIntoView({ behavior: 'smooth' });
                }
            };

            // REVEAL OBSERVER
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add("active");
                });
            }, { root: cardContainer || null, threshold: 0.1 });

            document.querySelectorAll(".w-reveal").forEach(r => observer.observe(r));

            // CUBE LOGIC
            let rot = 0;
            const c1 = document.getElementById("wC1"), c2 = document.getElementById("wC2");
            const n1 = document.getElementById("wN1"), n2 = document.getElementById("wN2");

            function spinCubes() {
                if(!c1) return;
                rot += 360;
                c1.style.transform = `rotateX(${rot}deg) rotateY(${rot}deg)`;
                c2.style.transform = `rotateX(${rot}deg) rotateY(${rot}deg)`;
                const mix = setInterval(() => {
                    n1.textContent = Math.floor(Math.random() * 10);
                    n2.textContent = Math.floor(Math.random() * 10);
                }, 100);
                setTimeout(() => {
                    clearInterval(mix);
                    n1.textContent = "1"; n2.textContent = "9";
                }, 1500);
            }
            setInterval(spinCubes, 6000);
            setTimeout(spinCubes, 1000);

            // TIMER
            const target = new Date("April 19, 2026 10:00:00").getTime();
            function updateTimer() {
                const now = new Date().getTime();
                const diff = target - now;
                if (diff < 0) return;
                document.getElementById("wD").innerText = String(Math.floor(diff / 864e5)).padStart(2, '0');
                document.getElementById("wH").innerText = String(Math.floor((diff % 864e5) / 36e5)).padStart(2, '0');
                document.getElementById("wM").innerText = String(Math.floor((diff % 36e5) / 6e4)).padStart(2, '0');
                document.getElementById("wS").innerText = String(Math.floor((diff % 6e4) / 1e3)).padStart(2, '0');
            }
            setInterval(updateTimer, 1000);
            updateTimer();
        })();
    </script>
</div>
