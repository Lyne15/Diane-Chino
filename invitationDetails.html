<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Details</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
    /* ===== VARIABLES & RESET ===== */
    #w-root {
        --w-sage: #717d6c;
        --w-dark: #3a4437;
        --w-gold: #c5a059;
        --w-cream: #fcfaf2;
        --w-glass: rgba(255,255,255,0.95);
        font-family: 'Playfair Display', serif;
        background: var(--w-cream);
        color: var(--w-dark);
        width: 100%;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
    }

    /* ===== HERO VIDEO ===== */
    #w-hero {
        height: 80vh;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
        background: #000;
    }
    #w-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* ===== CONTENT SECTIONS ===== */
    .w-section {
        width: 100%;
        max-width: 500px;
        padding: 40px 20px 25px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        box-sizing: border-box;
    }
    .w-reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .w-reveal.active { opacity: 1; transform: translateY(0); }

    h2 { 
        font-family: 'Great Vibes', cursive; 
        font-size: clamp(3rem, 14vw, 4.5rem); 
        color: var(--w-sage); 
        margin: 0; 
        line-height: 1.1; 
    }
    .w-sub {
        font-family: 'Cinzel', serif;
        font-size: 0.8rem;
        letter-spacing: 5px;
        color: var(--w-gold);
        margin-top: 10px;
        text-transform: uppercase;
    }

    /* ===== CALENDAR & TIMER ===== */
    .w-card-box {
        background: var(--w-glass);
        padding: 40px 20px;
        border-radius: 120px 120px 40px 40px;
        width: 240px;
        border: 1px solid rgba(197,160,89,0.2);
        box-shadow: 0 15px 35px rgba(0,0,0,0.05);
    }
    .w-cubes {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-bottom: 20px;
    }
    .w-wrap {
        width: 55px;
        height: 55px;
        perspective: 1000px;
    }
    .w-cube {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 1.8s cubic-bezier(0.4,0,0.2,1);
    }
    .w-face {
        position: absolute;
        width: 55px;
        height: 55px;
        background: #fff;
        border: 0.5px solid var(--w-gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        font-family: 'Cinzel', serif;
        color: var(--w-dark);
        backface-visibility: hidden;
    }
    .w-front { transform: rotateY(0deg) translateZ(27.5px); }
    .w-back { transform: rotateY(180deg) translateZ(27.5px); }
    .w-top { transform: rotateX(90deg) translateZ(27.5px); }
    .w-bottom { transform: rotateX(-90deg) translateZ(27.5px); }

    .w-timer-container { display: flex; justify-content: center; gap: 18px; width: 100%; }
    .w-t-unit { display: flex; flex-direction: column; align-items: center; }
    .w-val { font-size: 1.6rem; color: var(--w-dark); font-family: 'Cinzel', serif; font-weight: 700; }
    .w-label { font-size: 0.8rem; text-transform: uppercase; color: var(--w-gold); letter-spacing: 2px; margin-top: 5px; }

    .w-venue-pre { font-size: 1.1rem; font-style: italic; opacity: 0.8; margin-bottom: 5px; }
    .w-venue-name { font-family: 'Cinzel', serif; font-size: 1.3rem; font-weight: 700; letter-spacing: 3px; color: var(--w-dark); }

    /* ===== GALLERY ===== */
    #galleryContainer {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        padding-bottom: 60px;
    }
    .w-gallery-section {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
        touch-action: pan-y;
        user-select: none;
    }
    .w-image-stack {
        position: relative;
        width: 280px;
        height: 350px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 5;
    }
    .w-stack-img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        border: 8px solid #fff;
        transition: transform 0.6s cubic-bezier(0.23,1,0.32,1), opacity 0.6s ease;
        pointer-events: none;
        will-change: transform, opacity;
    }
    .img-1 { transform: translate(0,0) rotate(-2deg); z-index:3; }
    .img-2 { transform: translate(8px,8px) rotate(2deg); z-index:2; }
    .img-3 { transform: translate(-8px,12px) rotate(-1deg); z-index:1; }
    .scatter.img-1 { transform: translate(-15px,-10px) rotate(-3deg); }
    .scatter.img-2 { transform: translate(15px,5px) rotate(3deg); }
    .scatter.img-3 { transform: translate(0,15px) rotate(0deg); }
    .carousel-active .w-stack-img { opacity:0; transform: scale(0.6) translateX(0); }
    .carousel-active .w-stack-img.active { opacity:1; transform: scale(1) translateX(0); z-index:10; }
    .carousel-active .w-stack-img.next { opacity:0.3; transform: scale(0.75) translateX(280px); z-index:5; }
    .carousel-active .w-stack-img.prev { opacity:0.3; transform: scale(0.75) translateX(-280px); z-index:5; }
</style>
</head>
<body>

<div id="w-root">
    <!-- HERO VIDEO -->
    <section id="w-hero">
        <video id="w-video" autoplay muted playsinline loop>
            <source src="./details.mp4" type="video/mp4">
        </video>
    </section>

    <!-- INVITATION SECTION -->
    <section class="w-section">
        <div class="w-reveal">
            <h2>Save the Date</h2>
            <div class="w-sub">Chino & Diane</div>
        </div>

        <div class="w-reveal">
            <div class="w-card-box">
                <div class="w-cubes">
                    <div class="w-wrap">
                        <div class="w-cube" id="wC1">
                            <div class="w-face w-front" id="wN1">1</div>
                            <div class="w-face w-back">0</div>
                            <div class="w-face w-top">4</div>
                            <div class="w-face w-bottom">7</div>
                        </div>
                    </div>
                    <div class="w-wrap">
                        <div class="w-cube" id="wC2">
                            <div class="w-face w-front" id="wN2">9</div>
                            <div class="w-face w-back">2</div>
                            <div class="w-face w-top">5</div>
                            <div class="w-face w-bottom">8</div>
                        </div>
                    </div>
                </div>
                <div style="text-align:center; font-family: 'Cinzel', serif;">
                    <span style="font-size:1.1rem; letter-spacing:5px; font-weight:700;">APRIL</span>
                    <div style="height:1px; background:var(--w-gold); width:35px; margin:8px auto; opacity:0.5;"></div>
                    <span style="font-size:0.9rem; letter-spacing:4px; color:var(--w-gold);">2026</span>
                </div>
            </div>
        </div>

        <div class="w-reveal">
            <div class="w-timer-container">
                <div class="w-t-unit"><span class="w-val" id="wD">00</span><span class="w-label">Days</span></div>
                <div class="w-t-unit"><span class="w-val" id="wH">00</span><span class="w-label">Hrs</span></div>
                <div class="w-t-unit"><span class="w-val" id="wM">00</span><span class="w-label">Min</span></div>
                <div class="w-t-unit"><span class="w-val" id="wS">00</span><span class="w-label">Sec</span></div>
            </div>
        </div>

        <div class="w-reveal">
            <span class="w-venue-pre">The place to be for our wedding:</span>
            <div class="w-venue-name">BISTRO ALEJANDRO</div>
        </div>
    </section>

    <!-- GALLERY SECTION -->
    <section id="galleryContainer"></section>
</div>

<script>
(function(){
    /* ===== REVEAL ANIMATION ===== */
    const revealObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if(entry.isIntersecting) entry.target.classList.add("active");
        });
    }, {threshold:0.1});
    document.querySelectorAll(".w-reveal").forEach(r => revealObserver.observe(r));

    /* ===== CUBES ROTATION ===== */
    let rot=0;
    function spinCubes() {
        const c1=document.getElementById("wC1"), c2=document.getElementById("wC2");
        const n1=document.getElementById("wN1"), n2=document.getElementById("wN2");
        if(!c1) return;
        rot+=360;
        c1.style.transform=`rotateX(${rot}deg) rotateY(${rot}deg)`;
        c2.style.transform=`rotateX(${rot}deg) rotateY(${rot}deg)`;
        const mix=setInterval(()=>{ n1.textContent=Math.floor(Math.random()*10); n2.textContent=Math.floor(Math.random()*10); },100);
        setTimeout(()=>{ clearInterval(mix); n1.textContent="1"; n2.textContent="9"; },1500);
    }
    setInterval(spinCubes,8000);
    setTimeout(spinCubes,1000);

    /* ===== TIMER ===== */
    const target=new Date("April 19, 2026 10:00:00").getTime();
    function updateTimer(){
        const now=new Date().getTime(), diff=target-now;
        if(diff<0) return;
        document.getElementById("wD").innerText=String(Math.floor(diff/864e5)).padStart(2,'0');
        document.getElementById("wH").innerText=String(Math.floor((diff%864e5)/36e5)).padStart(2,'0');
        document.getElementById("wM").innerText=String(Math.floor((diff%36e5)/6e4)).padStart(2,'0');
        document.getElementById("wS").innerText=String(Math.floor((diff%6e4)/1e3)).padStart(2,'0');
    }
    setInterval(updateTimer,1000);
    updateTimer();

    /* ===== GALLERY ===== */
    const galleryContainer=document.getElementById('galleryContainer');
    fetch('gallery.html').then(r=>r.text()).then(html=>{
        galleryContainer.innerHTML=html;
        const gallerySection = galleryContainer.querySelector('#wSlider');
        if(!gallerySection) return;

        const images=[
            galleryContainer.querySelector('#gImg1'),
            galleryContainer.querySelector('#gImg2'),
            galleryContainer.querySelector('#gImg3')
        ];
        let carouselActive=false;
        let currentIndex=0;

        images.forEach((img,i)=>setTimeout(()=>img.classList.add('scatter'),i*150));
        setTimeout(()=>{
            carouselActive=true;
            gallerySection.classList.add('carousel-active');
            updateCarousel();
        },500);

        function updateCarousel(offset=0){
            if(!carouselActive) return;
            images.forEach((img,i)=>{
                img.classList.remove('active','next','prev');
                let pos=(i-currentIndex+images.length)%images.length;
                if(pos===0){
                    img.classList.add('active');
                    img.style.transform=`translateX(${offset}px) scale(${1-Math.abs(offset/1000)}) rotate(${offset/30}deg)`;
                    img.style.opacity=1; img.style.zIndex=10;
                } else if(pos===1){
                    img.classList.add('next');
                    img.style.transform=`translateX(${280+offset}px) scale(0.75)`;
                    img.style.opacity=0.3; img.style.zIndex=5;
                } else{
                    img.classList.add('prev');
                    img.style.transform=`translateX(${-280+offset}px) scale(0.75)`;
                    img.style.opacity=0.3; img.style.zIndex=5;
                }
            });
        }

        /* ===== TOUCH & SWIPE ===== */
        let startX=0, startY=0, isDragging=false, currentOffset=0, isScrolling=false;
        const handleStart=(e)=>{
            const touch=e.type.includes('touch')?e.touches[0]:e;
            startX=touch.clientX; startY=touch.clientY;
            isDragging=true; isScrolling=false; currentOffset=0;
            images.forEach(img=>img.style.transition='none');
        };
        const handleMove=(e)=>{
            if(!isDragging || isScrolling) return;
            const touch=e.type.includes('touch')?e.touches[0]:e;
            const diffX=touch.clientX-startX;
            const diffY=touch.clientY-startY;
            if(!isScrolling && Math.abs(diffY)>Math.abs(diffX) && Math.abs(diffY)>10){ isScrolling=true; isDragging=false; return; }
            if(Math.abs(diffX)>5){ if(e.cancelable) e.preventDefault(); currentOffset=diffX; updateCarousel(currentOffset); }
        };
        const handleEnd=()=>{
            if(!isDragging) return;
            isDragging=false;
            images.forEach(img=>img.style.transition='transform 0.5s cubic-bezier(0.2,0.8,0.2,1), opacity 0.5s ease');
            if(Math.abs(currentOffset)>60){ currentIndex=(currentIndex+(currentOffset<0?1:-1)+images.length)%images.length; }
            currentOffset=0; updateCarousel(0);
        };
        gallerySection.addEventListener('touchstart',handleStart,{passive:true});
        gallerySection.addEventListener('mousedown',handleStart);
        gallerySection.addEventListener('touchmove',handleMove,{passive:false});
        gallerySection.addEventListener('mousemove',handleMove);
        window.addEventListener('touchend',handleEnd);
        window.addEventListener('mouseup',handleEnd);
    });
})();
</script>

</body>
</html>
