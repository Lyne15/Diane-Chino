<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cinzel:wght@400;700&family=Great+Vibes&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">

<style>
/* ===== GLOBAL STYLES ===== */
body, html { 
    margin:0; padding:0; background: #fcfaf2; scroll-behavior: smooth; overflow-x: hidden; 
    -webkit-tap-highlight-color: transparent;
}

#w-root {
    --w-sage: #717d6c; --w-gold: #c5a059; --w-dark: #3a4437; --w-cream: #fcfaf2; --w-glass: rgba(255,255,255,0.95);
    font-family: 'Playfair Display', serif; display: flex; flex-direction: column; align-items: center;
}

.w-reveal { opacity: 0; transform: translateY(30px); transition: all 1s ease-out; width: 100%; }
.w-reveal.active { opacity: 1; transform: translateY(0); }

/* ===== 1. HERO VIDEO ===== */
#w-hero { 
    height: 70vh; width: 100%; background: #000; position: relative; overflow: hidden; margin-bottom: -20px; 
}
#w-video { width: 100%; height: 100%; object-fit: cover; }
#w-hero::after {
    content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 250px; 
    background: linear-gradient(to bottom, rgba(252, 250, 242, 0) 0%, rgba(252, 250, 242, 0.4) 30%, rgba(252, 250, 242, 0.8) 70%, #fcfaf2 100%);
    z-index: 2;
}

/* ===== 2. CALENDAR, TEXT, & TIMER SECTION ===== */
.w-section { 
    width: 100%; max-width: 500px; padding: 20px 25px 40px; text-align: center; box-sizing: border-box; 
    display: flex; flex-direction: column; align-items: center; gap: 25px; position: relative; z-index: 3;
}
h2 { font-family: 'Great Vibes', cursive; font-size: clamp(3rem, 12vw, 4rem); color: var(--w-sage); margin: 0; }
.w-names { font-family:'Cinzel'; letter-spacing:4px; color:var(--w-gold); font-size: 0.7rem; margin-top: 8px; }

/* Calendar Cube */
.w-card-box {
    background: var(--w-glass); padding: 30px 20px; border-radius: 120px 120px 40px 40px; 
    width: 200px; border: 1px solid rgba(197,160,89,0.2); box-shadow: 0 15px 35px rgba(0,0,0,0.05);
}
.w-cubes { display: flex; gap: 12px; justify-content: center; margin-bottom: 15px; }
.w-wrap { width: 45px; height: 45px; perspective: 1000px; }
.w-cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1.8s cubic-bezier(0.4,0,0.2,1); }
.w-face { position: absolute; width: 45px; height: 45px; background: #fff; border: 0.5px solid var(--w-gold); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-family: 'Cinzel', serif; color: var(--w-dark); }
.w-front { transform: rotateY(0deg) translateZ(22.5px); }
.w-back { transform: rotateY(180deg) translateZ(22.5px); }
.w-top { transform: rotateX(90deg) translateZ(22.5px); }
.w-bottom { transform: rotateX(-90deg) translateZ(22.5px); }

/* Timer */
.w-timer-container { display: flex; justify-content: center; gap: 15px; }
.w-t-unit { display: flex; flex-direction: column; align-items: center; min-width: 50px; }
.w-val { font-size: 1.2rem; color: var(--w-dark); font-family: 'Cinzel', serif; font-weight: 700; }
.w-label { font-size: 0.55rem; text-transform: uppercase; color: var(--w-gold); letter-spacing: 1px; }

/* ===== 3. STACKED TO CAROUSEL GALLERY ===== */
.gallery-outer { width: 100%; background: #fdfbf7; padding: 60px 0; overflow: hidden; position: relative; }
.w-gallery-container {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    gap: 0; padding: 0 15%; -webkit-overflow-scrolling: touch; align-items: center; height: 400px;
    transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
}
.w-gallery-container::-webkit-scrollbar { display: none; }
.w-item { flex: 0 0 70%; scroll-snap-align: center; position: relative; transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1); margin: 0 -10px; }

/* Stacked State */
.is-stacked .w-item:nth-child(1) { transform: translate(100px, 15px) rotate(-12deg); z-index: 1; opacity: 0.8; }
.is-stacked .w-item:nth-child(2) { transform: translate(0, 0) rotate(0deg); z-index: 5; opacity: 1; }
.is-stacked .w-item:nth-child(3) { transform: translate(-100px, 20px) rotate(12deg); z-index: 1; opacity: 0.8; }

/* Carousel Focus State */
.w-item.is-active { transform: scale(1.0); z-index: 10; opacity: 1; filter: blur(0); }
.w-item:not(.is-active) { transform: scale(0.85); opacity: 0.5; filter: blur(2px); }
.w-item img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border: 10px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }

/* ===== 4. MAP SECTION ===== */
.map-card { border: 1px solid var(--w-gold); padding: 25px 15px; background: #fff; width: 100%; box-sizing: border-box; }
.map-title { font-family:'Cinzel'; font-size: 0.75rem; font-weight:700; letter-spacing:2px; margin-bottom: 15px; color: var(--w-dark); }

/* ===== 5. COLOR PALETTE & ATTIRE ===== */
.w-attire-section { width: 100%; max-width: 500px; padding: 40px 24px; text-align: center; box-sizing: border-box; }
.dear-reader { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: var(--w-gold); }
.color-overlay { position: absolute; top:0; left:0; width:100%; height:100%; mix-blend-mode: multiply; transition: 0.5s; -webkit-mask-size:contain; mask-size:contain; -webkit-mask-repeat:no-repeat; mask-position:center; }
#overlayBride { -webkit-mask-image: url('./maidss.png.png'); mask-image: url('./maidss.png.png'); }
#overlayGroom { -webkit-mask-image: url('./groom.png(1)(1).png'); mask-image: url('./groom.png(1)(1).png'); }

.palette { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 25px; }
.color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
</style>
</head>

<body>

<div id="w-root">

    <section id="w-hero">
        <video id="w-video" autoplay muted playsinline loop>
            <source src="./details.mp4" type="video/mp4">
        </video>
    </section>

    <section class="w-section w-reveal">
        <div>
            <h2>Save the Date</h2>
            <div class="w-names">CHINO & DIANE</div>
        </div>
        
        <div class="w-card-box">
            <div class="w-cubes">
                <div class="w-wrap"><div class="w-cube" id="wC1"><div class="w-face w-front">1</div><div class="w-face w-back">0</div><div class="w-face w-top">4</div><div class="w-face w-bottom">7</div></div></div>
                <div class="w-wrap"><div class="w-cube" id="wC2"><div class="w-face w-front">9</div><div class="w-face w-back">2</div><div class="w-face w-top">5</div><div class="w-face w-bottom">8</div></div></div>
            </div>
            <div style="text-align:center; font-family: 'Cinzel', serif;">
                <span style="font-size:0.9rem; letter-spacing:3px; font-weight:700;">APRIL</span>
                <div style="height:1px; background:var(--w-gold); width:25px; margin:8px auto; opacity:0.4;"></div>
                <span style="font-size:0.7rem; color:var(--w-gold);">2026</span>
            </div>
        </div>

        <p style="font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 0.9rem; color: var(--w-dark); opacity: 0.8;">
            “Taking our time, holding our promises, and dreaming of forever together.”
        </p>

        <div class="w-timer-container">
            <div class="w-t-unit"><span class="w-val" id="wD">00</span><span class="w-label">Days</span></div>
            <div class="w-t-unit"><span class="w-val" id="wH">00</span><span class="w-label">Hrs</span></div>
            <div class="w-t-unit"><span class="w-val" id="wM">00</span><span class="w-label">Min</span></div>
            <div class="w-t-unit"><span class="w-val" id="wS">00</span><span class="w-label">Sec</span></div>
        </div>
    </section>

    <div class="gallery-outer" id="galleryTrigger">
        <div class="w-gallery-container is-stacked" id="mainGallery">
            <div class="w-item"><img src="./place.jpeg"></div>
            <div class="w-item is-active"><img src="./place2.png"></div>
            <div class="w-item"><img src="./place3.png"></div>
        </div>
        <p id="swipeHint" style="font-family:'Cinzel'; font-size: 0.55rem; color: var(--w-gold); margin-top: 20px; letter-spacing: 2px; text-align: center; opacity:0; transition: 1s;">Swipe to explore</p>
    </div>

    <div class="w-section w-reveal">
        <div class="map-card">
            <p class="map-title">BISTRO ALEJANDRO</p>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3862.348658824101!2d121.2384!3d14.5076!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTTCsDMwJzI3LjQiTiAxMjHCsDE0JzE4LjIiRQ!5e0!3m2!1sen!2sph!4v1620000000000!5m2!1sen!2sph" style="width:100%; height:200px; border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <section class="w-attire-section">
        <div class="w-reveal">
            <div class="dear-reader">Dear Readers,</div>
            <p style="font-family:'Libre Baskerville'; font-style:italic; font-size:0.95rem; color:var(--w-dark);">“In the spirit of Bridgerton, please arrive in your finest Regency-inspired attire.”</p>
        </div>
        <div class="w-reveal">
            <div style="display: flex; justify-content: center; gap: 10px; margin-top: 25px;">
                <div style="position: relative; width: 45%; aspect-ratio: 2/3;"><img src="./maidss.png.png" style="width:100%; height:100%; object-fit:contain;"><div class="color-overlay" id="overlayBride"></div></div>
                <div style="position: relative; width: 45%; aspect-ratio: 2/3;"><img src="./groom.png(1)(1).png" style="width:100%; height:100%; object-fit:contain;"><div class="color-overlay" id="overlayGroom"></div></div>
            </div>
            <div class="palette">
                <div class="color-btn" style="background-color: #FFFFE0;" onclick="changeColor('#FFFFE0')"></div>
                <div class="color-btn" style="background-color: #FFFACD;" onclick="changeColor('#FFFACD')"></div>
                <div class="color-btn" style="background-color: #FFFF66;" onclick="changeColor('#FFFF66')"></div>
                <div class="color-btn" style="background-color: #556B2F;" onclick="changeColor('#556B2F')"></div>
                <div class="color-btn" style="background-color: #8FBC8F;" onclick="changeColor('#8FBC8F')"></div>
                <div class="color-btn" style="background-color: #BCE3BC;" onclick="changeColor('#BCE3BC')"></div>
            </div>
        </div>
    </section>

</div>

<script>
window.changeColor = function(color) {
    document.getElementById('overlayBride').style.backgroundColor = color;
    document.getElementById('overlayGroom').style.backgroundColor = color;
};

(function(){
    // CAROUSEL LOGIC
    const galleryTrigger = document.getElementById('galleryTrigger');
    const galleryContainer = document.getElementById('mainGallery');
    const hint = document.getElementById('swipeHint');
    let stackTimeout;

    const galleryObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if(entry.isIntersecting) {
                stackTimeout = setTimeout(() => {
                    galleryContainer.classList.remove('is-stacked');
                    hint.style.opacity = "1";
                    const items = document.querySelectorAll('.w-item');
                    items[1].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }, 2000); 
            } else {
                clearTimeout(stackTimeout);
                galleryContainer.classList.add('is-stacked');
                galleryContainer.scrollTo({left: 0});
                hint.style.opacity = "0";
            }
        });
    }, { threshold: 0.5 });
    galleryObserver.observe(galleryTrigger);

    galleryContainer.addEventListener('scroll', () => {
        if(galleryContainer.classList.contains('is-stacked')) return;
        const items = document.querySelectorAll('.w-item');
        let closest = null;
        let closestDistance = Infinity;
        items.forEach(item => {
            const rect = item.getBoundingClientRect();
            const distance = Math.abs((rect.left + rect.width / 2) - (window.innerWidth / 2));
            if (distance < closestDistance) {
                closestDistance = distance;
                closest = item;
            }
        });
        items.forEach(item => item.classList.remove('is-active'));
        if (closest) closest.classList.add('is-active');
    });

    // CUBE LOGIC
    let rot = 0;
    setInterval(() => {
        rot += 360;
        const c1 = document.getElementById("wC1"), c2 = document.getElementById("wC2");
        if(c1) c1.style.transform = `rotateX(${rot}deg) rotateY(${rot}deg)`;
        if(c2) c2.style.transform = `rotateX(${rot}deg) rotateY(${rot}deg)`;
    }, 8000);

    // TIMER LOGIC
    const target = new Date("April 19, 2026 10:00:00").getTime();
    function updateTimer(){
        const now = new Date().getTime(), diff = target - now;
        if(diff < 0) return;
        document.getElementById("wD").innerText = String(Math.floor(diff/864e5)).padStart(2,'0');
        document.getElementById("wH").innerText = String(Math.floor((diff%864e5)/36e5)).padStart(2,'0');
        document.getElementById("wM").innerText = String(Math.floor((diff%36e5)/6e4)).padStart(2,'0');
        document.getElementById("wS").innerText = String(Math.floor((diff%6e4)/1e3)).padStart(2,'0');
    }
    setInterval(updateTimer,1000); updateTimer();

    // REVEAL LOGIC
    const revealObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if(entry.isIntersecting) entry.target.classList.add("active");
        });
    }, { threshold: 0.1 });
    document.querySelectorAll(".w-reveal").forEach(r => revealObserver.observe(r));
})();
</script>
</body>
</html>
