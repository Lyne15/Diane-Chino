<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation | April 19, 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sage-green: #717d6c;
            --dark-green: #3a4437;
            --gold: #c5a059;
            --soft-yellow: #fdfcf0;
            --cream: #fcfaf2;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--soft-yellow);
            color: var(--dark-green);
            font-family: 'Playfair Display', serif;
            overflow-x: hidden;
        }

        /* Background Motif */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(113, 125, 108, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(197, 160, 89, 0.05) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        /* 1. HERO VIDEO */
        #hero-section {
            height: 100vh;
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #hero-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 2. MAIN CONTENT SECTION */
        .content-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        /* Animated Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.2s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: var(--sage-green);
            margin-bottom: 5px;
        }

        .sub-title {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 5px;
            color: var(--gold);
            margin-bottom: 40px;
        }

        /* ELEGANT CUBE CARD */
        .invitation-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 100px 100px 0 0; /* Arched Top Look */
            border: 1px solid rgba(197, 160, 89, 0.3);
            width: 90%;
            max-width: 320px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            position: relative;
        }

        .cube-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .cube-wrap { width: 65px; height: 65px; perspective: 1000px; }
        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            /* Transition bagalan natin para sa "smooth" na ikot */
            transition: transform 2s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .face {
            position: absolute; width: 65px; height: 65px;
            background: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; font-weight: bold; font-family: 'Cinzel', serif;
            color: var(--dark-green);
            border: 1px solid var(--gold);
        }

        .front  { transform: rotateY(0deg) translateZ(32.5px); }
        .back   { transform: rotateY(180deg) translateZ(32.5px); }
        .top    { transform: rotateX(90deg) translateZ(32.5px); }
        .bottom { transform: rotateX(-90deg) translateZ(32.5px); }

        .month-display {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--dark-green);
            letter-spacing: 6px;
            padding-top: 20px;
            border-top: 1px solid rgba(197, 160, 89, 0.2);
        }

        /* ELEGANT TIMER */
        .timer-wrap {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .timer-unit {
            display: flex;
            flex-direction: column;
        }

        .timer-val {
            font-size: 2rem;
            font-weight: 300;
            color: var(--dark-green);
            font-family: 'Playfair Display', serif;
        }

        .timer-label {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .time-location {
            margin-top: 40px;
            font-style: italic;
            font-size: 0.95rem;
            color: var(--sage-green);
        }

        /* Gold Leaf Divider */
        .divider {
            width: 50px;
            height: 1px;
            background: var(--gold);
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <section id="hero-section">
        <video id="hero-video" playsinline muted autoplay>
            <source src="./details.mp4" type="video/mp4">
        </video>
    </section>

    <section id="main-content" class="content-section">
        
        <div class="reveal">
            <h2>Save the Date</h2>
            <div class="sub-title">A New Chapter Begins</div>
        </div>

        <div class="invitation-card reveal">
            <div class="cube-container">
                <div class="cube-wrap">
                    <div class="cube" id="c1">
                        <div class="face front" id="num1">1</div>
                        <div class="face back">4</div>
                        <div class="face top">0</div>
                        <div class="face bottom">7</div>
                    </div>
                </div>
                <div class="cube-wrap">
                    <div class="cube" id="c2">
                        <div class="face front" id="num2">9</div>
                        <div class="face back">2</div>
                        <div class="face top">5</div>
                        <div class="face bottom">8</div>
                    </div>
                </div>
            </div>
            <div class="month-display">APRIL 2026</div>
        </div>

        <div class="reveal">
            <div class="timer-wrap">
                <div class="timer-unit"><span class="timer-val" id="d">00</span><span class="timer-label">Days</span></div>
                <div class="timer-unit"><span class="timer-val" id="h">00</span><span class="timer-unit">Hrs</span></div>
                <div class="timer-unit"><span class="timer-val" id="m">00</span><span class="timer-unit">Min</span></div>
                <div class="timer-unit"><span class="timer-val" id="s">00</span><span class="timer-unit">Sec</span></div>
            </div>

            <div class="divider"></div>
            <div class="time-location">Ten o'clock in the morning</div>
        </div>

    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('hero-video');

            // 1. Reveal Elements on Scroll
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

            // 2. Auto-Scroll
            video.onended = () => {
                document.getElementById('main-content').scrollIntoView({ behavior: 'smooth' });
            };

            // 3. ELEGANT CUBE LOGIC (2s Rotate, 2s Stop)
            const c1 = document.getElementById('c1');
            const c2 = document.getElementById('c2');
            const n1 = document.getElementById('num1');
            const n2 = document.getElementById('num2');

            let isOriginalDate = true;
            let rotation = 0;

            function animateCubes() {
                // Step 1: Start Rotating (takes 2 seconds)
                rotation += 360;
                c1.style.transform = `rotateX(${rotation}deg) rotateY(${rotation}deg)`;
                c2.style.transform = `rotateX(${rotation}deg) rotateY(${rotation}deg)`;

                // Randomize numbers while spinning
                let shuffle = setInterval(() => {
                    n1.innerText = Math.floor(Math.random()*10);
                    n2.innerText = Math.floor(Math.random()*10);
                }, 150);

                // Step 2: Stop and show 19 (after 2 seconds of rotation)
                setTimeout(() => {
                    clearInterval(shuffle);
                    n1.innerText = "1";
                    n2.innerText = "9";
                    
                    // Wait for 2 seconds while stopped, then trigger next cycle
                    setTimeout(animateCubes, 2000); 
                }, 2000);
            }

            // Start the cycle
            setTimeout(animateCubes, 1000);

            // 4. TIMER
            const target = new Date("April 19, 2026 10:00:00").getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const diff = target - now;
                if (diff < 0) return;
                document.getElementById('d').innerText = String(Math.floor(diff / (1000*60*60*24))).padStart(2,'0');
                document.getElementById('h').innerText = String(Math.floor((diff % (1000*60*60*24)) / (1000*60*60))).padStart(2,'0');
                document.getElementById('m').innerText = String(Math.floor((diff % (1000*60*60)) / (1000*60))).padStart(2,'0');
                document.getElementById('s').innerText = String(Math.floor((diff % (1000*60)) / 1000)).padStart(2,'0');
            }, 1000);
        });
    </script>
</body>
</html>
