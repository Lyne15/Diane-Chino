<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bridgerton Candle Intro</title>

<style>
    body {
        margin: 0;
        background: radial-gradient(circle at center, #1a1a1a 0%, #0b0b0b 70%);
        font-family: 'Georgia', serif;
        overflow: hidden;
        color: #f5e6c8;
        text-align: center;
    }

    .table {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 35%;
        background: linear-gradient(to top, #3b2a1d, #2a1d14);
        box-shadow: 0 -20px 40px rgba(0,0,0,0.8);
    }

    .candle-wrapper {
        position: absolute;
        left: 50%;
        bottom: 35%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .candle {
        width: 30px;
        height: 120px;
        background: linear-gradient(to bottom, #f8f1e4, #e8dccb);
        border-radius: 8px;
        position: relative;
        box-shadow: 0 0 20px rgba(255, 240, 200, 0.2);
    }

    .flame {
        width: 22px;
        height: 35px;
        background: radial-gradient(circle at 50% 60%, #ffd36b, #ff8c00 70%);
        border-radius: 50% 50% 50% 50%;
        position: absolute;
        top: -28px;
        left: 50%;
        transform: translateX(-50%);
        animation: flicker 0.15s infinite alternate;
        box-shadow: 0 0 25px rgba(255, 180, 80, 0.9);
    }

    @keyframes flicker {
        from { transform: translateX(-50%) scale(1); opacity: 1; }
        to { transform: translateX(-50%) scale(1.1); opacity: 0.85; }
    }

    .smoke {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(200,200,200,0.4);
        position: absolute;
        top: -35px;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        animation: smokeRise 2s ease-out forwards;
    }

    @keyframes smokeRise {
        0% { opacity: 0.6; transform: translate(-50%, 0) scale(0.5); }
        100% { opacity: 0; transform: translate(-50%, -80px) scale(1.5); }
    }

    .instruction {
        position: absolute;
        top: 15%;
        width: 100%;
        font-size: 1.2rem;
        letter-spacing: 1px;
        opacity: 0.85;
    }

    .invite-text {
        position: absolute;
        top: 40%;
        width: 100%;
        opacity: 0;
        transition: opacity 2s ease;
        font-size: 1.8rem;
    }

    button {
        margin-top: 20px;
        padding: 10px 18px;
        font-size: 14px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
        background: #c6a85b;
        color: #1a1a1a;
    }
</style>
</head>

<body>

<div class="instruction">
    Make a wish… then gently blow 💨<br/>
    <button onclick="startMic()">Start Experience</button>
</div>

<div class="invite-text" id="invite">
    <div>Together with their families</div>
    <div><strong>Lyne & Partner</strong></div>
    <div>request the honour of your presence</div>
</div>

<div class="candle-wrapper">
    <div class="candle">
        <div class="flame" id="flame"></div>
    </div>
</div>

<div class="table"></div>

<script>
let audioContext, analyser, mic, dataArray;
let blownOut = false;

async function startMic() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        mic = audioContext.createMediaStreamSource(stream);
        mic.connect(analyser);

        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        listenForBlow();
        document.querySelector("button").style.display = "none";
    } catch (err) {
        alert("Microphone access denied 😢 You can add a tap alternative later.");
    }
}

function listenForBlow() {
    requestAnimationFrame(listenForBlow);
    analyser.getByteFrequencyData(dataArray);

    let volume = dataArray.reduce((a, b) => a + b) / dataArray.length;

    // Threshold for blow detection
    if (volume > 60 && !blownOut) {
        blownOut = true;
        blowOutCandle();
    }
}

function blowOutCandle() {
    const flame = document.getElementById("flame");
    flame.style.display = "none";

    const smoke = document.createElement("div");
    smoke.classList.add("smoke");
    flame.parentElement.appendChild(smoke);

    document.getElementById("invite").style.opacity = 1;
}
</script>

</body>
</html>
