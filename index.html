<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Grand Bridgerton Invitation</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Playfair Display', serif;
            overflow-x: hidden;
            overflow-y: auto;
            background: url('./diangandchinoimage.png') no-repeat center center / cover;
            min-height: 100vh;
            background-color: #000;
            margin: 0;
        }

        .scroll-viewport::-webkit-scrollbar { display: none; }
        .scroll-viewport { -ms-overflow-style: none; scrollbar-width: none; }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            opacity: 0;
            transition: opacity 2s ease;
        }
        .video-background.active { opacity: 1; }
        .video-background video { width: 100%; height: 100%; object-fit: cover; }

        .main-content.active::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.8;
            z-index: -1;
            animation: glitterMotion 20s linear infinite;
            pointer-events: none;
        }

        @keyframes glitterMotion {
            0% { background-position: 0 0; }
            100% { background-position: 500px 500px; }
        }

        #landingScreen {
            position: absolute;
            top: 71%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #startButton {
            padding: 14px 40px;
            background: linear-gradient(135deg, #d8c8a0 0%, #cbb78a 40%, #b49e6b 100%);
            color: #031d0b;
            border: 2.5px solid #D4AF37;
            border-radius: 40px;
            font-size: 1.1rem;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            letter-spacing: 1.8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(212,175,55,0.45), inset 0 0 12px rgba(255,255,255,0.25);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }

        :root {
            --color-gold-light: #f3e5c9;
            --color-gold-dark: #e0cca4;
            --color-background-blur: rgba(255, 255, 255, 0.35);
        }

        .name-input-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 360px;
            padding: 30px 20px;
            border-radius: 40px;
            background: var(--color-background-blur);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, top 0.3s ease;
            box-sizing: border-box;
        }
        .name-input-container.active { opacity: 1; visibility: visible; pointer-events: auto; }

        .input-row { 
            display: flex; 
            width: 100%; 
            height: 50px; 
            border-radius: 25px; 
            overflow: hidden; 
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #guestNameInput { 
            flex: 1; 
            padding: 0 20px; 
            border: none; 
            outline: none; 
            font-family: 'Poppins', sans-serif; 
            font-size: 16px; 
            background: transparent;
        }

        #submitNameButton { 
            flex-shrink: 0;
            width: 90px;
            border: none; 
            background: linear-gradient(to bottom, var(--color-gold-light), var(--color-gold-dark)); 
            cursor: pointer; 
            font-family: 'Playfair Display'; 
            font-weight: bold;
            font-size: 1rem;
            color: #4a4a4a;
        }

        #mainContent {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        #mainContent.active { opacity: 1; visibility: visible; }

        .envelope-wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            background: #F8F7EE;
            cursor: pointer;
            box-shadow: 0 20px 50px rgba(0,0,0,1.5);
            border: 1px solid #757C6A;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
        }
        .envelope-wrapper.visible { opacity: 1; visibility: visible; animation: float 3s ease-in-out infinite; }
        .envelope-wrapper.open { animation: none; }

        .envelope .side { position: absolute; top: 0; width: 0; height: 0; border-top: 100px solid transparent; border-bottom: 100px solid transparent; z-index: 3; }
        .envelope .side.left { left: 0; border-left: 150px solid #939A88; }
        .envelope .side.right { right: 0; border-right: 150px solid #939A88; }
        .envelope .bottom { position: absolute; bottom: 0; left: 0; width: 0; height: 0; border-left: 150px solid transparent; border-right: 150px solid transparent; border-bottom: 115px solid #757C6A; z-index: 4; }
        .envelope .lid {
            position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 150px solid transparent; border-right: 150px solid transparent; border-top: 100px solid #939A88; 
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }

        .card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 253px;
            height: 160px;
            background: #FEFCF7;
            border-radius: 4px;
            z-index: 2; 
            border: 5px outset #D4AF37;
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .envelope-wrapper.open .card {
            opacity: 1;
            visibility: visible;
            top: -40px;
            transition-delay: 0.3s;
        }

        .envelope-wrapper.open .lid { transform: rotateX(180deg); z-index: 1; }

        .card.full-screen {
            position: fixed;
            top: 0 !important; 
            left: 0 !important;
            transform: translate(0, 0) !important;
            width: 100vw; 
            height: 100vh; 
            z-index: 9999;
            box-shadow: none; 
            border: 0; 
            background: #FEFCF7;
            overflow-y: auto;
            overflow-x: hidden;
            display: block;
            border-radius: 0;
        }

        .close-icon {
            display: none;
            position: fixed; 
            top: 20px;
            right: 20px;
            font-size: 3rem;
            color: #D4AF37;
            cursor: pointer;
            z-index: 10001;
        }
        .card.full-screen .close-icon { display: block; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div class="video-background">
        <video id="bgVideo" loop muted playsinline>
            <source src="./videoCastleGate.mp4" type="video/mp4">
        </video>
    </div>

    <audio id="bgMusic" loop>
        <source src="./palagiViolin.mp3" type="audio/mpeg">
    </audio>

    <div id="landingScreen">
        <button id="startButton">Chino & Diane</button>
    </div>

    <div class="name-input-container" id="nameInputContainer">
        <p style="color: #4a4a4a; font-style: italic; font-size: 1.5rem; text-align: center; font-family: 'Cormorant Garamond'; margin-bottom: 20px;">A Message From Chino & Diane</p>
        <div class="input-row">
            <input type="text" id="guestNameInput" placeholder="first name..." required>
            <button id="submitNameButton">GO</button>
        </div>
        <p id="nameError" style="color:red; font-size: 0.8rem; margin-top:10px; font-family: 'Poppins';"></p>
    </div>

    <div class="main-content" id="mainContent">
        <div class="envelope-wrapper" id="envelope">
            <div class="envelope">
                <div class="card" id="card">
                    <span class="close-icon" id="closeBtn">&times;</span>
                    <div id="fullDetailsContainer"></div>
                </div>
                <div class="side left"></div>
                <div class="side right"></div>
                <div class="bottom"></div>
                <div class="lid"></div>
            </div>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const landingScreen = document.getElementById('landingScreen');
        const mainContent = document.getElementById('mainContent');
        const bgVideo = document.getElementById('bgVideo');
        const bgMusic = document.getElementById('bgMusic');
        const envelope = document.getElementById('envelope');
        const card = document.getElementById('card');
        const closeBtn = document.getElementById('closeBtn');
        const detailsContainer = document.getElementById('fullDetailsContainer');
        const nameInputContainer = document.getElementById('nameInputContainer');
        const nameInput = document.getElementById('guestNameInput');
        const submitButton = document.getElementById('submitNameButton');
        const nameError = document.getElementById('nameError');

        let guestData = [];
        let nameVerified = false;

        async function loadContent() {
            try {
                const resData = await fetch('./guestData.json');
                guestData = await resData.json();
                const resHtml = await fetch('./invitationDetails.html');
                const html = await resHtml.text();
                detailsContainer.innerHTML = html;
                
                const scripts = detailsContainer.querySelectorAll("script");
                scripts.forEach(oldScript => {
                    const newScript = document.createElement("script");
                    newScript.text = oldScript.text;
                    document.body.appendChild(newScript);
                });
            } catch (e) { console.error("Loading error:", e); }
        }

        startButton.addEventListener('click', () => {
            landingScreen.style.display = 'none';
            mainContent.classList.add('active');
            document.querySelector('.video-background').classList.add('active');
            bgVideo.play();
            bgMusic.play();
            setTimeout(() => { envelope.classList.add('visible'); }, 4000);
            loadContent();
        });

        envelope.addEventListener('click', () => {
            if (nameVerified) return;
            nameInputContainer.classList.add('active');
            nameInput.focus();
        });

        submitButton.addEventListener('click', () => {
            const input = nameInput.value.trim().toUpperCase();
            if (!input) return;

            const found = guestData.find(g => g.names.some(n => n.toUpperCase() === input));
            
            if (found || input === "GUEST") {
                nameVerified = true;

                const footerSection = document.createElement('div');
                footerSection.style.position = "relative";
                footerSection.style.aspectRatio = "1 / 1.4"; 
                footerSection.style.backgroundImage = "url('./letterbg.png')"; 
                footerSection.style.backgroundSize = "contain"; 
                // footerSection.style.backgroundRepeat = "no-repeat";
                footerSection.style.backgroundPosition = "center top";
                footerSection.style.overflow = "hidden"; 

                const scrollViewport = document.createElement('div');
                scrollViewport.className = "scroll-viewport";
                scrollViewport.style.position = "absolute";
                scrollViewport.style.top = "20%";
                scrollViewport.style.height = "65%";
                scrollViewport.style.left = "0";
                scrollViewport.style.width = "100%";
                scrollViewport.style.overflowY = "auto";
                scrollViewport.style.webkitOverflowScrolling = "touch";

                const textWrapper = document.createElement('div');
                textWrapper.style.padding = "0% 15% 15%"; 
                textWrapper.style.textAlign = "center";
                textWrapper.style.width = "100%";
                textWrapper.style.boxSizing = "border-box";
                textWrapper.style.fontFamily = "'Cormorant Garamond', serif";
                textWrapper.style.color = "#3a4437";

                // --- PART 1: RSVP TEXT ONLY ---
                const rsvpText = `
                    <div style="font-family: 'Playfair Display', serif; margin-top: 10px; margin-bottom: 20px;">
                        <h3 style="color: #4a4a4a; letter-spacing: 2px; font-size: 0.9rem; margin-bottom: 10px; text-transform: uppercase; font-weight: bold;">RSVP</h3>
                    </div>
                `;

                // --- PART 2: PERSONAL MESSAGE ---
                let personalMessage = "";
                if (found && found.message) {
                    personalMessage = `
                        <div style="margin-bottom: 30px;">
                            <p style="font-size: 1.15rem; line-height: 1.5; margin: 0; font-style: italic;">
                                "${found.message}"
                            </p>
                        </div>
                    `;
                }

                // --- PART 3: THE TWO BUTTONS AT THE END ---
                const rsvpButtons = `
                    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 10px;">
                        <a href="https://m.me/ChinoLamJr" target="_blank" 
                           style="text-decoration: none; background: #717d6c; color: #fff; width: 190px; padding: 10px; border-radius: 40px; font-family: 'Poppins', sans-serif; font-size: 0.65rem; font-weight: 600; letter-spacing: 1px; display: inline-block;">
                           CONFIRM WITH CHINO
                        </a>
                        <a href="https://m.me/XDaegusvenus" target="_blank" 
                           style="text-decoration: none; border: 1.5px solid #D4AF37; background: rgba(255,255,255,0.7); color: #8a6d3b; width: 190px; padding: 10px; border-radius: 40px; font-family: 'Poppins', sans-serif; font-size: 0.65rem; font-weight: 600; letter-spacing: 1px; display: inline-block;">
                           CONFIRM WITH DIANE
                        </a>
                    </div>
                `;

                // --- COMBINE IN THE REQUESTED ORDER ---
                textWrapper.innerHTML = rsvpText + personalMessage + rsvpButtons;
                
                scrollViewport.appendChild(textWrapper);
                footerSection.appendChild(scrollViewport);
                detailsContainer.appendChild(footerSection);

                nameInputContainer.classList.remove('active');
                envelope.classList.add('open');
                
                setTimeout(() => {
                    card.classList.add('full-screen');
                    document.body.style.overflow = 'hidden';
                }, 1200);
            } else {
                nameError.textContent = "Your name was not found. Please check your spelling.";
            }
        });

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            card.classList.remove('full-screen');
            document.body.style.overflow = 'auto';
        });
    </script>
</body>
</html>
