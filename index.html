<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Grand Bridgerton Invitation</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-sage-light: #5a6e55;
            --color-sage-mid: #4a5d45;
            --color-sage-dark: #3a4b36;
            --color-gold: #D4AF37;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Playfair Display', serif;
            overflow-x: hidden;
            overflow-y: auto;
            background: url('./diangandchinoimage.png') no-repeat center center / cover;
            background-color: #000;
            min-height: 100vh;
            margin: 0;
        }

        /* Video Background */
        .video-background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            z-index: -2;
            opacity: 0;
            transition: opacity 2s ease;
        }
        .video-background.active { opacity: 1; }
        .video-background video { width: 100%; height: 100%; object-fit: cover; }

        /* Landing Screen Button */
        #landingScreen {
            position: absolute;
            top: 71%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #startButton {
            padding: 14px 40px;
            background: linear-gradient(135deg, #d8c8a0 0%, #cbb78a 40%, #b49e6b 100%);
            color: #031d0b;
            border: 2.5px solid var(--color-gold);
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1.8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(212,175,55,0.45), inset 0 0 12px rgba(255,255,255,0.25);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        /* Music Toggle */
        #musicToggle {
            position: fixed; bottom: 25px; left: 25px;
            z-index: 10002; width: 45px; height: 45px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px); border: 1px solid var(--color-gold);
            color: var(--color-gold); display: none; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        /* Main Content Area */
        #mainContent {
            opacity: 0; visibility: hidden;
            transition: opacity 1s ease;
            height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
        }
        #mainContent.active { opacity: 1; visibility: visible; }

        /* --- ENVELOPE DESIGN --- */
        .envelope-wrapper {
            position: relative;
            width: 300px; height: 200px;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
            perspective: 1000px;
        }

        .envelope-wrapper.visible {
            opacity: 1;
            visibility: visible;
            animation: float 3s ease-in-out infinite, royal-glow 2s infinite ease-in-out;
        }

        /* Real Image Wax Seal */
        .wax-seal-img {
            position: absolute;
            top: 43%; left: 50%;
            transform: translate(-50%, -15%);
            width: 53px; /* Adjust size based on your image */
            height: auto;
            z-index: 10;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            transition: opacity 0.4s ease, transform 0.8s ease;
            pointer-events: none;
        }

        /* Shine Effect */
        .envelope-wrapper.visible::after {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-25deg);
            z-index: 20;
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { left: -150%; }
            30% { left: 150%; }
            100% { left: 150%; }
        }

        /* Envelope Shapes */
        .envelope {
            position: relative;
            width: 100%; height: 100%;
            background-color: var(--color-sage-mid);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .envelope .side { 
            position: absolute; top: 0; width: 0; height: 0; 
            border-top: 100px solid transparent; 
            border-bottom: 100px solid transparent; 
            z-index: 3; 
        }
        .envelope .side.left { left: 0; border-left: 150px solid var(--color-sage-mid); }
        .envelope .side.right { right: 0; border-right: 150px solid var(--color-sage-mid); }
        
        .envelope .bottom { 
            position: absolute; bottom: 0; left: 0; width: 0; height: 0; 
            border-left: 150px solid transparent; 
            border-right: 150px solid transparent; 
            border-bottom: 115px solid var(--color-sage-dark); 
            z-index: 4; 
        }
        
        .envelope .lid {
            position: absolute; top: 0; left: 0; width: 0; height: 0; 
            border-left: 150px solid transparent; 
            border-right: 150px solid transparent; 
            border-top: 110px solid var(--color-sage-light); 
            transform-origin: top; transition: transform 0.8s ease; 
            z-index: 5;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }

        /* Card (Inside Envelope) */
        .card {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 260px; height: 170px; background: #FEFCF7; border: 4px double var(--color-gold);
            z-index: 2; opacity: 0; transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden; box-shadow: inset 0 0 20px rgba(212,175,55,0.1);
        }

        /* Open State */
        .envelope-wrapper.open .lid { transform: rotateX(180deg); z-index: 1; }
        .envelope-wrapper.open .wax-seal-img { opacity: 0; transform: translate(-50%, -100%) scale(0.5); }
        .envelope-wrapper.open .card { opacity: 1; top: -40px; }
        .envelope-wrapper.open { animation: none !important; box-shadow: none; }
        .envelope-wrapper.open::after { display: none; }

        /* Full Screen Card */
        .card.full-screen { 
            position: fixed; top: 0 !important; left: 0 !important; 
            transform: none !important; width: 100vw; height: 100vh; 
            z-index: 9999; border: 0; border-radius: 0; overflow-y: auto; 
        }
        .close-icon { 
            display: none; position: fixed; top: 20px; right: 20px; 
            font-size: 3rem; color: var(--color-gold); cursor: pointer; z-index: 10001; 
        }
        .card.full-screen .close-icon { display: block; }

        /* Name Input Container */
        .name-input-container {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            display: flex; flex-direction: column; align-items: center;
            width: 90%; max-width: 350px;
            padding: 30px; border-radius: 30px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
        }
        .name-input-container.active { opacity: 1; visibility: visible; }
        .input-row { display: flex; width: 100%; height: 45px; border-radius: 25px; overflow: hidden; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #guestNameInput { flex: 1; padding: 0 20px; border: none; outline: none; background: white; font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; }
        #submitNameButton { padding: 0 20px; border: none; background: linear-gradient(to bottom, #f3e5c9, #e0cca4); cursor: pointer; color: #4a4a4a; font-weight: bold; }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        @keyframes royal-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 45px rgba(212, 175, 55, 0.8); transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="video-background">
        <video id="bgVideo" loop muted playsinline>
            <source src="./videoCastleGate.mp4" type="video/mp4">
        </video>
    </div>

    <audio id="bgMusic" loop>
        <source src="./palagiViolin.mp3" type="audio/mpeg">
    </audio>

    <button id="musicToggle">🎶</button>

    <div id="landingScreen">
        <button id="startButton">Chino & Diane</button>
    </div>

    <div class="name-input-container" id="nameInputContainer">
        <p style="color: #4a4a4a; font-style: italic; font-size: 1.6rem; text-align: center; margin: 0;">A Message From Chino & Diane</p>
        <div class="input-row">
            <input type="text" id="guestNameInput" placeholder="Enter your first name...">
            <button id="submitNameButton">Enter</button>
        </div>
        <p id="nameError" style="color:#8b1419; font-size: 0.85rem; margin-top:10px; text-align: center; font-weight: bold;"></p>
    </div>

    <div id="mainContent">
        <div class="envelope-wrapper" id="envelope">
            <img src="./sealed.png" alt="Seal" class="wax-seal-img">
            
            <div class="envelope">
                <div class="card" id="card">
                    <span class="close-icon" id="closeBtn">&times;</span>
                    <div id="fullDetailsContainer"></div>
                </div>
                <div class="side left"></div>
                <div class="side right"></div>
                <div class="bottom"></div>
                <div class="lid"></div>
            </div>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const landingScreen = document.getElementById('landingScreen');
        const mainContent = document.getElementById('mainContent');
        const bgVideo = document.getElementById('bgVideo');
        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        const envelope = document.getElementById('envelope');
        const card = document.getElementById('card');
        const closeBtn = document.getElementById('closeBtn');
        const detailsContainer = document.getElementById('fullDetailsContainer');
        const nameInputContainer = document.getElementById('nameInputContainer');
        const nameInput = document.getElementById('guestNameInput');
        const submitButton = document.getElementById('submitNameButton');

        let guestData = [];
        let nameVerified = false;

        async function loadContent() {
            try {
                const resData = await fetch('./guestData.json');
                guestData = await resData.json();
                const resHtml = await fetch('./invitationDetails.html');
                const html = await resHtml.text();
                detailsContainer.innerHTML = html;
            } catch (e) { console.error("Error loading data:", e); }
        }

        function executeScripts() {
            const scripts = detailsContainer.querySelectorAll("script");
            scripts.forEach(oldScript => {
                const newScript = document.createElement("script");
                newScript.text = oldScript.text;
                document.body.appendChild(newScript);
            });
        }

        musicToggle.addEventListener('click', () => {
            if (bgMusic.paused) { bgMusic.play(); musicToggle.innerHTML = "🎶"; } 
            else { bgMusic.pause(); musicToggle.innerHTML = "🔇"; }
        });

        startButton.addEventListener('click', () => {
            landingScreen.style.display = 'none';
            mainContent.classList.add('active');
            document.querySelector('.video-background').classList.add('active');
            bgVideo.play();
            bgMusic.play();
            musicToggle.style.display = 'flex';
            
            setTimeout(() => { 
                envelope.classList.add('visible'); 
            }, 6000);

            loadContent();
        });

        envelope.addEventListener('click', () => {
            if (nameVerified) return;
            nameInputContainer.classList.add('active');
            nameInput.focus();
        });

        submitButton.addEventListener('click', () => {
            const input = nameInput.value.trim().toUpperCase();
            if (!input) return;

            const found = guestData.find(g => g.names.some(n => n.toUpperCase() === input));
            
            if (found || input === "GUEST") {
                nameVerified = true;
                nameInputContainer.classList.remove('active');
                envelope.classList.add('open');

                if (found && found.message) {
                    const personalMsgDiv = document.createElement('div');
                    personalMsgDiv.style.padding = "40px 20px";
                    personalMsgDiv.style.borderTop = "2px double #D4AF37";
                    personalMsgDiv.style.textAlign = "center";
                    personalMsgDiv.style.fontFamily = "'Cormorant Garamond', serif";
                    personalMsgDiv.innerHTML = `<p style="font-size: 1.3rem; color: #4a4a4a;">"${found.message}"</p>`;
                    detailsContainer.appendChild(personalMsgDiv);
                }

                setTimeout(() => {
                    card.classList.add('full-screen');
                    executeScripts();
                    document.body.style.overflow = 'hidden';
                }, 1500);
            } else {
                document.getElementById('nameError').textContent = "Paumanhin, hindi mahanap ang iyong pangalan.";
            }
        });

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            card.classList.remove('full-screen');
            document.body.style.overflow = 'auto';
        });
    </script>
</body>
</html>
