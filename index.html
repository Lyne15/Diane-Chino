<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Grand Bridgerton Invitation</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sage-dark: #2d3b2d;
            --sage-mid: #3e4f3e;
            --sage-light: #4a5d4a;
            --color-gold: #D4AF37;
            --fairy-glow: rgba(212, 175, 55, 0.6);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Playfair Display', serif;
            overflow: hidden; 
            background: url('./diangandchinoimage.png') no-repeat center center / cover;
            background-color: #000;
            min-height: 100vh;
            margin: 0;
        }

        .video-background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            opacity: 0;
            transition: opacity 2s ease;
        }
        .video-background.active { opacity: 1; }
        .video-background video { width: 100%; height: 100%; object-fit: cover; }

        #landingScreen {
            position: absolute;
            top: 71%; left: 0; width: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }

        #startButton {
            padding: 14px 40px;
            background: linear-gradient(135deg, #d8c8a0 0%, #cbb78a 40%, #b49e6b 100%);
            color: #031d0b;
            border: 2.5px solid var(--color-gold);
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1.8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(212,175,55,0.45);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        #musicToggle {
            position: fixed; bottom: 25px; left: 25px;
            z-index: 1000002; width: 45px; height: 45px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px); border: 1px solid var(--color-gold);
            color: var(--color-gold); display: none; align-items: center; justify-content: center;
            cursor: pointer;
        }

        #mainContent {
            opacity: 0; visibility: hidden;
            transition: opacity 1s ease;
            height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
        }
        #mainContent.active { opacity: 1; visibility: visible; }

        /* --- ENVELOPE --- */
        .envelope-wrapper {
            position: relative;
            width: 400px; height: 280px;
            opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease;
            perspective: 1500px;
        }

        .envelope-wrapper.visible {
            opacity: 1; visibility: visible;
            animation: float 3s ease-in-out infinite;
        }

        /* --- THE CARD --- */
        .card {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 360px; height: 250px;
            background: #FEFCF7;
            border: 4px double var(--color-gold);
            z-index: 2; /* Likod ng flaps */
            opacity: 0;
            /* Smooth transition para sa pag-akyat at pag-expand */
            transition: 
                top 1.8s cubic-bezier(0.4, 0, 0.2, 1), 
                transform 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                width 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                height 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.8s ease;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .envelope-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .svg-back { z-index: 1; }
        .svg-front { z-index: 4; }
        .svg-lid { 
            z-index: 5; 
            transform-origin: top;
            /* Dahan-dahang pagbubukas ng lid */
            transition: transform 1.5s cubic-bezier(0.445, 0.05, 0.55, 0.95);
        }

        /* ANIMATION STATES */
        .envelope-wrapper.open .svg-lid { 
            transform: rotateX(160deg);
            z-index: 1; 
        }

        .envelope-wrapper.open .card { 
            opacity: 1; 
            top: -10%; /* Silip muna sa itaas */
            z-index: 6; 
        }

        /* Full Screen Soft Transition */
        .card.full-screen {
            top: 50% !important;
            left: 50% !important;
            width: 95vw !important;
            height: 95vh !important;
            transform: translate(-50%, -50%) scale(1) !important;
            z-index: 1000000 !important;
            position: fixed !important;
            overflow-y: auto;
        }

        .close-icon { 
            display: none; position: fixed; top: 20px; right: 20px; 
            font-size: 2.5rem; color: var(--color-gold); cursor: pointer; 
            z-index: 1000001; background: white; border-radius: 50%; 
            width: 50px; height: 50px; line-height: 45px; text-align: center;
        }
        .card.full-screen .close-icon { display: block; }

        .wax-seal-img {
            position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%);
            width: 65px; z-index: 15;
            transition: opacity 0.5s ease;
        }
        .envelope-wrapper.open .wax-seal-img { opacity: 0; }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }

        /* --- NAME INPUT --- */
        .name-input-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            z-index: 2000; display: flex; flex-direction: column; align-items: center;
            width: 90%; max-width: 380px; padding: 40px 30px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); border: 1.5px solid var(--color-gold);
            opacity: 0; visibility: hidden; transition: all 0.5s ease;
        }
        .name-input-container.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .input-row { display: flex; width: 100%; height: 48px; background: white; border-radius: 25px; overflow: hidden; }
        #guestNameInput { flex: 1; padding: 0 20px; border: none; outline: none; font-size: 1.1rem; }
        #submitNameButton { padding: 0 25px; border: none; background: var(--color-gold); color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="video-background">
        <video id="bgVideo" loop muted playsinline>
            <source src="./videoCastleGate.mp4" type="video/mp4">
        </video>
    </div>

    <audio id="bgMusic" loop>
        <source src="./palagiViolin.mp3" type="audio/mpeg">
    </audio>

    <button id="musicToggle">🎶</button>

    <div id="landingScreen">
        <button id="startButton">Chino & Diane</button>
    </div>

    <div class="name-input-container" id="nameInputContainer">
        <p style="color: white; font-family: 'Playfair Display';">A Message From Chino & Diane</p>
        <div class="input-row">
            <input type="text" id="guestNameInput" placeholder="Enter your first name...">
            <button id="submitNameButton">Enter</button>
        </div>
        <p id="nameError" style="color:#ffbaba; font-size: 0.9rem; margin-top:10px;"></p>
    </div>

    <div id="mainContent">
        <div class="envelope-wrapper" id="envelope">
            
            <svg class="envelope-svg svg-back" viewBox="0 0 400 280">
                <rect width="400" height="280" fill="#1b241b" />
            </svg>

            <div class="card" id="card">
                <span class="close-icon" id="closeBtn">&times;</span>
                <div id="fullDetailsContainer"></div>
            </div>

            <svg class="envelope-svg svg-front" viewBox="0 0 400 280">
                <path d="M0,0 L180,140 L0,280 Z" fill="var(--sage-dark)" />
                <path d="M400,0 L220,140 L400,280 Z" fill="var(--sage-dark)" />
                <path d="M0,280 L200,120 L400,280 Z" fill="var(--sage-mid)" stroke="var(--color-gold)" stroke-width="0.5" />
                <path class="svg-lid" d="M0,0 L200,160 L400,0 Z" fill="var(--sage-mid)" stroke="var(--color-gold)" stroke-width="1.5" />
            </svg>

            <img src="./sealed.png" alt="Seal" class="wax-seal-img">
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const landingScreen = document.getElementById('landingScreen');
        const mainContent = document.getElementById('mainContent');
        const bgVideo = document.getElementById('bgVideo');
        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        const envelope = document.getElementById('envelope');
        const card = document.getElementById('card');
        const closeBtn = document.getElementById('closeBtn');
        const detailsContainer = document.getElementById('fullDetailsContainer');
        const nameInputContainer = document.getElementById('nameInputContainer');
        const nameInput = document.getElementById('guestNameInput');
        const submitButton = document.getElementById('submitNameButton');

        let guestData = [];

        async function loadContent() {
            try {
                const resData = await fetch('./guestData.json');
                guestData = await resData.json();
                const resHtml = await fetch('./invitationDetails.html');
                const html = await resHtml.text();
                detailsContainer.innerHTML = html;
            } catch (e) { console.error(e); }
        }

        startButton.addEventListener('click', () => {
            landingScreen.style.display = 'none';
            mainContent.classList.add('active');
            document.querySelector('.video-background').classList.add('active');
            bgVideo.play();
            bgMusic.play();
            musicToggle.style.display = 'flex';
            setTimeout(() => { envelope.classList.add('visible'); }, 3000);
            loadContent();
        });

        envelope.addEventListener('click', () => {
            nameInputContainer.classList.add('active');
            nameInput.focus();
        });

        nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitButton.click(); });

        submitButton.addEventListener('click', () => {
            const input = nameInput.value.trim().toUpperCase();
            const found = guestData.find(g => g.names.some(n => n.toUpperCase() === input));
            
            if (found || input === "GUEST") {
                nameInputContainer.classList.remove('active');
                
                // Sequence of Animations
                envelope.classList.add('open'); // 1. Lid opens slowly

                // 2. Wait for lid, then pull card up
                setTimeout(() => {
                    // 3. Card expands to fill screen smoothly
                    card.classList.add('full-screen');
                    document.body.style.overflowY = 'auto';
                }, 2000); 

            } else {
                document.getElementById('nameError').textContent = "Hindi mahanap ang iyong pangalan.";
            }
        });

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            card.classList.remove('full-screen');
            document.body.style.overflowY = 'hidden';
            window.scrollTo(0, 0);
        });
    </script>
</body>
</html>
