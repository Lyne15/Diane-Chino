<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
    body {
        margin: 0;
        background: #78651a; /* Matches --w-cream */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    .w-gallery-section {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        min-height: 440px;
        overflow: hidden;
        touch-action: pan-x; /* Allow horizontal swipe */
        user-select: none;
    }

    .w-image-stack {
        position: relative;
        width: 280px;
        height: 350px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 5;
    }

    .w-stack-img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        border: 8px solid #fff;
        transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.6s ease;
        will-change: transform, opacity;
    }

    /* Stack Initial States */
    .img-1 { transform: translate(0, 0) rotate(-2deg); z-index: 3; }
    .img-2 { transform: translate(8px, 8px) rotate(2deg); z-index: 2; }
    .img-3 { transform: translate(-8px, 12px) rotate(-1deg); z-index: 1; }

    .scatter.img-1 { transform: translate(-15px, -10px) rotate(-3deg); }
    .scatter.img-2 { transform: translate(15px, 5px) rotate(3deg); }
    .scatter.img-3 { transform: translate(0, 15px) rotate(0deg); }

    /* Carousel State */
    .carousel-active .w-stack-img { opacity: 0; transform: scale(0.6) translateX(0); }
    .carousel-active .w-stack-img.active { opacity: 1; transform: scale(1) translateX(0); z-index: 10; }
    .carousel-active .w-stack-img.next { opacity: 0.3; transform: scale(0.75) translateX(280px); z-index: 5; }
    .carousel-active .w-stack-img.prev { opacity: 0.3; transform: scale(0.75) translateX(-280px); z-index: 5; }
</style>
</head>
<body>

<section class="w-gallery-section" id="wGalleryTrigger">
    <div class="w-image-stack" id="wSlider">
        <img src="./place.jpeg" class="w-stack-img img-1" id="gImg1" alt="Venue 1">
        <img src="./place2.png" class="w-stack-img img-2" id="gImg2" alt="Venue 2">
        <img src="./place3.png" class="w-stack-img img-3" id="gImg3" alt="Venue 3">
    </div>
</section>

<script>
(function() {
    const gallerySection = document.getElementById('wGalleryTrigger');
    const images = [
        document.getElementById('gImg1'),
        document.getElementById('gImg2'),
        document.getElementById('gImg3')
    ];
    let carouselActive = false;
    let currentIndex = 0;

    // Activate gallery when in view
    const galleryObserver = new IntersectionObserver(entries => {
        const entry = entries[0];
        if (entry.isIntersecting && !carouselActive) {
            images.forEach((img, i) => setTimeout(() => img.classList.add('scatter'), i * 150));
            setTimeout(() => {
                carouselActive = true;
                gallerySection.classList.add('carousel-active');
                updateCarousel();
            }, 1000);
        }
    }, { threshold: 0.2 });
    galleryObserver.observe(gallerySection);

    function updateCarousel(offset = 0) {
        images.forEach((img, i) => {
            img.classList.remove('active', 'next', 'prev');
            let pos = (i - currentIndex + images.length) % images.length;

            if (pos === 0) {
                img.classList.add('active');
                img.style.transform = `translateX(${offset}px) scale(${1 - Math.abs(offset/1000)}) rotate(${offset/30}deg)`;
                img.style.opacity = 1;
                img.style.zIndex = 10;
            } else if (pos === 1) {
                img.classList.add('next');
                img.style.transform = `translateX(${280 + offset}px) scale(0.75)`;
                img.style.opacity = 0.3;
                img.style.zIndex = 5;
            } else {
                img.classList.add('prev');
                img.style.transform = `translateX(${-280 + offset}px) scale(0.75)`;
                img.style.opacity = 0.3;
                img.style.zIndex = 5;
            }
        });
    }

    let startX = 0, startY = 0, isDragging = false, currentOffset = 0, isScrolling = false;

    function handleStart(e) {
        if (!carouselActive) return;
        const touch = e.type.includes('touch') ? e.touches[0] : e;
        startX = touch.clientX;
        startY = touch.clientY;
        isDragging = true;
        isScrolling = false;
        currentOffset = 0;
        images.forEach(img => img.style.transition = 'none');
    }

    function handleMove(e) {
        if (!isDragging || isScrolling) return;
        const touch = e.type.includes('touch') ? e.touches[0] : e;
        const diffX = touch.clientX - startX;
        const diffY = touch.clientY - startY;

        if (!isScrolling && Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 10) {
            isScrolling = true;
            isDragging = false;
            return;
        }

        if (Math.abs(diffX) > 5) {
            if (e.cancelable) e.preventDefault();
            currentOffset = diffX;
            updateCarousel(currentOffset);
        }
    }

    function handleEnd() {
        if (!isDragging) return;
        isDragging = false;
        images.forEach(img => img.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease');

        if (Math.abs(currentOffset) > 60) {
            currentIndex = (currentIndex + (currentOffset < 0 ? 1 : -1) + images.length) % images.length;
        }

        currentOffset = 0;
        updateCarousel(0);
    }

    gallerySection.addEventListener('touchstart', handleStart, {passive: false});
    gallerySection.addEventListener('mousedown', handleStart);
    gallerySection.addEventListener('touchmove', handleMove, {passive: false});
    gallerySection.addEventListener('mousemove', handleMove);
    window.addEventListener('touchend', handleEnd);
    window.addEventListener('mouseup', handleEnd);
})();
</script>

</body>
</html>
